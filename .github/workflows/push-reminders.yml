name: Reminder push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: reminder-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: scripts/push
        run: npm install --no-audit --no-fund
      - name: Send due reminders
        working-directory: scripts/push
        run: node send.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
