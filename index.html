<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arecmik</title>
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#23262D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" href="icon-192-lemon.png">
<link rel="apple-touch-icon" href="apple-touch-icon-lemon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* Layout: sidebar | main view | right panel. Clean neutral grays, lemon as the one brand accent. */
:root{
  --bg:#FFFFFF; --side:#F7F7F9; --panel:#FBFBFC; --surface:#FFFFFF; --sunken:#F2F2F5; --hover:#EDEDF1; --dim:#FAFAFB;
  --line:#E6E6EB; --line-soft:#F0F0F3;
  --fg:#1D1D1F; --fg2:#48484A; --muted:#6E6E73; --faint:#AEAEB2;
  --lemon:#F5D547; --lemon-soft:#FFF4C2; --lemon-ink:#6B5300; --on-lemon:#1D1D1F; --sel:#FFFBEA; --lemon-strong:#E9B600;
  --blue:#2F6FDB; --blue-soft:#E8EFFC; --blue-ink:#1F4FA8;
  --green:#2E8B57; --green-soft:#E3F2E9; --green-ink:#1E6B40;
  --violet:#7A5AC8; --violet-soft:#EEE8FA; --violet-ink:#5A3FA0;
  --rose:#C0392B; --rose-soft:#FBE9E7; --rose-ink:#9A2D22;
  --ink-btn:#1D1D1F; --ink-btn-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.07); --shadow-md:0 8px 24px rgba(0,0,0,.10); --shadow-lg:0 24px 60px rgba(0,0,0,.22);
  --scrim:rgba(20,20,22,.32);
  --font:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151517; --side:#1B1B1E; --panel:#19191C; --surface:#1F1F23; --sunken:#29292E; --hover:#2E2E34; --dim:#19191C;
  --line:#34343A; --line-soft:#2A2A2F;
  --fg:#F2F2F5; --fg2:#D1D1D6; --muted:#9A9AA2; --faint:#5E5E66;
  --lemon:#E9C93A; --lemon-soft:#3A3315; --lemon-ink:#F3DE84; --on-lemon:#1D1D1F; --sel:#24221A;
  --blue:#6E9BF0; --blue-soft:#1E2A42; --blue-ink:#A9C3F7;
  --green:#5CC08A; --green-soft:#1B3326; --green-ink:#9ADBB6;
  --violet:#A98BEB; --violet-soft:#2A2340; --violet-ink:#CBB8F5;
  --rose:#F07A6C; --rose-soft:#3A1F1C; --rose-ink:#F6B0A7;
  --ink-btn:#F2F2F5; --ink-btn-fg:#151517;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#151517; --side:#1B1B1E; --panel:#19191C; --surface:#1F1F23; --sunken:#29292E; --hover:#2E2E34; --dim:#19191C;
  --line:#34343A; --line-soft:#2A2A2F;
  --fg:#F2F2F5; --fg2:#D1D1D6; --muted:#9A9AA2; --faint:#5E5E66;
  --lemon:#E9C93A; --lemon-soft:#3A3315; --lemon-ink:#F3DE84; --on-lemon:#1D1D1F; --sel:#24221A;
  --blue:#6E9BF0; --blue-soft:#1E2A42; --blue-ink:#A9C3F7;
  --green:#5CC08A; --green-soft:#1B3326; --green-ink:#9ADBB6;
  --violet:#A98BEB; --violet-soft:#2A2340; --violet-ink:#CBB8F5;
  --rose:#F07A6C; --rose-soft:#3A1F1C; --rose-ink:#F6B0A7;
  --ink-btn:#F2F2F5; --ink-btn-fg:#151517;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55); color-scheme:dark; }

html,body{height:100%}
#app{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{flex:none}
.c-lemon{--pc:var(--lemon);--pc-bg:var(--lemon-soft);--pc-ink:var(--lemon-ink)}
.c-blue{--pc:var(--blue);--pc-bg:var(--blue-soft);--pc-ink:var(--blue-ink)}
.c-green{--pc:var(--green);--pc-bg:var(--green-soft);--pc-ink:var(--green-ink)}
.c-violet{--pc:var(--violet);--pc-bg:var(--violet-soft);--pc-ink:var(--violet-ink)}
.c-rose{--pc:var(--rose);--pc-bg:var(--rose-soft);--pc-ink:var(--rose-ink)}

.app{position:relative;display:grid;grid-template-columns:var(--side-w, 252px) minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line-soft);overflow-y:auto;padding-block:16px 18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:12px;display:flex;flex-direction:column;gap:16px}
.main{overflow:auto;min-width:0;position:relative;background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:0 4px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--lemon);color:var(--on-lemon);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.seg{display:flex;background:var(--sunken);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;height:30px;border:0;border-radius:7px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.inline{display:inline-flex}
.seg .cnt{font-size:12px;color:var(--muted);margin-left:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--sunken);border-radius:8px;padding:0 10px;height:34px;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;font-size:14px;width:100%;min-width:0;color:var(--fg)}
.search kbd{font-family:inherit;font-size:11.5px;color:var(--muted);white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;border:0;background:transparent;font-size:14.5px;width:100%;text-align:left;cursor:pointer}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nav-item .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.sec{display:flex;flex-direction:column;gap:1px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 4px 10px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.addm button{height:38px}
.mini{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mini:hover{background:var(--hover);color:var(--fg)}
.tree-row{display:flex;align-items:center;gap:2px;min-height:30px;border-radius:8px;padding-right:2px}
.tree-row:hover{background:var(--hover)}
.tree-row.on{background:var(--surface);box-shadow:var(--shadow)}
.tree-row.on .nm{font-weight:600}
.tree-row .tw{width:20px;height:24px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tree-row .nm{flex:1;min-width:0;display:flex;align-items:center;gap:7px;border:0;background:transparent;font-size:14px;text-align:left;cursor:pointer;padding:5px 2px;color:var(--fg)}
.tree-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .nm svg{color:var(--muted)}
.tree-row .cnt{font-size:13px;color:var(--muted);min-width:18px;text-align:right}
.tree-row .add{opacity:0}
.tree-row:hover .add,.tree-row .add:focus-visible{opacity:1}
.tree-doc{display:flex;align-items:center;gap:7px;min-height:28px;width:100%;border:0;background:transparent;border-radius:8px;font-size:13.5px;text-align:left;cursor:pointer;color:var(--fg2);padding-right:8px}
.tree-doc:hover{background:var(--hover)}
.tree-doc.on{background:var(--surface);box-shadow:var(--shadow);color:var(--fg);font-weight:600}
.tree-doc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-doc svg{color:var(--faint)}
.tree-input{flex:1;height:28px;border:1px solid var(--blue);border-radius:7px;padding:0 8px;font-size:14px;background:var(--surface);outline:none;min-width:0}
.side-foot{margin-top:auto;font-size:12.5px;line-height:1.55;color:var(--muted);padding:12px 6px 0;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.link-btn{border:0;background:transparent;padding:0;font-size:12.5px;color:var(--blue-ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.9;background:var(--ink-btn)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:13.5px}
.btn.sm.icon{width:28px;padding:0}
.btn.danger{color:var(--rose)}
.btn.warn{background:var(--rose);color:#FFFFFF;border-color:transparent}
.inp{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:14px;background:var(--surface);color:var(--fg);min-width:0}
.inp:focus{outline:none;border-color:var(--blue)}
.muted{color:var(--muted)}
.grow{flex:1}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.empty{font-size:14px;color:var(--muted);padding:10px 4px;line-height:1.55}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 2px 4px}
.h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.topbar .menu-btn{display:none}
.pager{display:flex;gap:4px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap;min-width:0}
.crumbs button{border:0;background:transparent;padding:2px 4px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:14px}
.crumbs button:hover{background:var(--hover);color:var(--fg)}
.crumbs b{color:var(--fg);font-weight:600}

/* WORK calendar */
.cal-wrap{display:flex;height:100%}
.cal-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.cal-wrap>.panel{overflow-y:auto}
.cal-scroll{overflow-x:auto;flex:1;display:flex;flex-direction:column}
.cal{min-width:540px;flex:1;display:flex;flex-direction:column}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.dow span{padding:8px 10px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);min-height:112px;flex:1 1 0}
.wk.sel{min-height:230px;flex:1.7 1 0}
.wk:last-child{border-bottom:1px solid var(--line)}
.cal-main>.cal-scroll{margin-bottom:var(--foot-gap, 0px)}
.cell{border-right:1px solid var(--line-soft);padding:5px 7px;min-width:0}
.cell.last{border-right:0}
.cell.other{background:var(--dim)}
.cell.other .num{color:var(--faint)}
.cell.we .num{color:var(--muted)}
.cell.selday{background:var(--sel)}
.drop-hi{outline:2px dashed var(--blue);outline-offset:-2px;background:var(--blue-soft)!important}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;border-radius:11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.num.today{background:var(--lemon);color:var(--on-lemon)}
.today-tag{font-size:12px;font-weight:700;color:var(--lemon-ink);margin-left:4px}
.bar{position:relative;z-index:2;margin:1px 4px;height:22px;border-radius:6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar.proj{background:var(--pc-bg);color:var(--pc-ink)}
.bar.ev{background:var(--surface);border:1.5px solid var(--blue);color:var(--blue-ink);height:20px}
.bar .bt{overflow:hidden;text-overflow:ellipsis}
.bar .meta{margin-left:auto;font-weight:500;opacity:.85;padding-left:8px}
.bar .dot{width:6px;height:6px;border-radius:3px;background:var(--blue)}
.handle{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:3}
.handle::after{content:"";position:absolute;right:3px;top:5px;bottom:5px;width:2.5px;border-radius:2px;background:currentColor;opacity:.4}
.items{position:relative;z-index:2;display:flex;flex-direction:column;gap:2px;padding:3px 5px 8px;min-width:0}
.chip{position:relative;display:flex;align-items:center;gap:5px;font-size:13px;min-height:23px;padding:2px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;color:var(--fg)}
.chip:hover{background:var(--hover)}
.chip .dot{width:6px;height:6px;border-radius:3px;flex:none}
.chip .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.chip .tt{overflow:hidden;text-overflow:ellipsis}
.chip.done .tt{text-decoration:line-through;color:var(--muted)}
.chip .handle{opacity:0;color:var(--blue)}
.chip:hover .handle{opacity:1}
.dragging{opacity:.35}
.more{border:0;background:transparent;text-align:left;font-size:12.5px;color:var(--muted);padding:2px 6px;cursor:pointer}
.chk{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--blue);background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#FFFFFF}
.chk svg{opacity:0}
.chk.on{background:var(--faint);border-color:var(--faint)}
.chk.on svg{opacity:1}
.chk.lg{width:20px;height:20px;border-radius:6px}
body.resizing,body.resizing *{cursor:ew-resize!important;user-select:none}

.panel{width:var(--panel-w, 360px);box-sizing:border-box;flex:none;border-left:1px solid var(--line);background:var(--panel);padding-block:16px 32px;padding-left:16px;padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card-title{font-size:15px;font-weight:700;padding:2px 4px 8px}
.addline{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:9px;background:var(--sunken);color:var(--muted)}
.addline input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--fg);height:34px}
.tlist{display:flex;flex-direction:column;gap:1px;padding-top:6px}
.trow{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-radius:8px}
.trow:hover{background:var(--hover)}
.trow .grip{color:var(--faint);cursor:grab;padding-top:2px;display:flex}
.trow .chk{margin-top:2px}
.tlink{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:transparent;padding:0;text-align:left;font-size:14px;line-height:1.45;cursor:pointer;color:var(--fg)}
.trow.done .tlink>span:first-child{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--pc-bg);color:var(--pc-ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-btn{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-size:13px;color:var(--muted);padding:8px 4px 2px;cursor:pointer}
.day-h{display:flex;align-items:baseline;gap:6px;padding:0 2px 8px}
.day-h h2{margin:0;font-size:15px;font-weight:700}
.evrow{display:flex;gap:10px;width:100%;padding:8px;border:0;border-radius:9px;background:var(--blue-soft);text-align:left;cursor:pointer;color:var(--fg);margin-bottom:4px}
.evrow .eb{width:3px;border-radius:2px;background:var(--blue);flex:none}
.evrow .et{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:13px;color:var(--muted)}
.evrow .et b{font-size:14.5px;color:var(--fg);font-weight:600}
.evrow .et .pt{font-weight:600;color:var(--pc-ink)}
.projline{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 0}
.projline button{border:0;cursor:pointer}
.day-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.day-add .addline{flex:1 1 140px;min-width:0}
.day-add .btn{flex:none}
.addline{min-width:0}
.wk.sel .chip{white-space:normal;align-items:flex-start;overflow:visible;text-align:left}
.wk.sel .chip .tt{flex:1;min-width:0}
.wk.sel .chip .tt{overflow:visible;text-overflow:clip;line-height:1.4}
.wk.sel .chip .dot{margin-top:6px}
.wk.sel .chip .chk{margin-top:2px}

/* dialogs */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(56px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px))}
.dialog{position:relative;width:100%;max-width:600px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden}
.dialog.sm{max-width:460px}
.dlg-head{padding:16px 22px 16px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:12px}
.dlg-top{display:flex;align-items:center;gap:6px}
.kind{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--sunken);color:var(--fg2)}
.kind.ev{background:var(--blue-soft);color:var(--blue-ink)}
.kind.pr{background:var(--lemon-soft);color:var(--lemon-ink)}
.title-input{border:0;background:transparent;padding:0;font-size:23px;font-weight:700;letter-spacing:-.02em;outline:none;width:100%;color:var(--fg)}
.title-input::placeholder,.doc-title::placeholder{color:var(--faint)}
.fgrid{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 12px;align-items:center;font-size:14.5px}
.fgrid>label{color:var(--muted)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.dlg-body{padding:14px 22px 24px;display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:11px;border:2px solid transparent;background:var(--pc);cursor:pointer;padding:0}
.sw.on{border-color:var(--fg)}
.plist{display:flex;flex-direction:column;gap:1px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;font-size:14.5px}
.prow:hover{background:var(--hover)}
.prow .tlink{flex-direction:row;align-items:center;gap:8px}
.prow .sub{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* block editor */
.ed{display:flex;flex-direction:column;gap:1px;font-size:15px;line-height:1.65;min-width:0}
.ed.sm{font-size:14.5px;line-height:1.6}
.ed{padding-left:22px}
.bk{position:relative;display:flex;align-items:flex-start;gap:8px;padding-left:calc(var(--ind,0) * 26px);min-width:0}
.bk.sub::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--ind,0) * 26px - 17px);border-left:0}
.bk-tw{position:absolute;left:calc(var(--ind,0) * 26px - 22px);top:.3em;width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:0;z-index:1}
.bk:hover>.bk-tw,.bk-tw.closed,.bk-tw:focus-visible{opacity:1}
.bk-tw:hover{background:var(--hover)}
@media (min-width:861px){ .doc .ed{margin-left:-22px} }
.bk-more{flex:none;align-self:center;font-size:12.5px;color:var(--muted);background:var(--sunken);border-radius:6px;padding:1px 7px}
@media (hover:none){ .bk-tw{opacity:.7} }
.bk-text{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;padding:1px 2px;border-radius:4px}
.ed .bk-text:empty:focus::before,.ed.ed-empty .bk-text:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.bk-h .bk-text{font-size:1.28em;font-weight:700;letter-spacing:-.01em;padding-top:8px}
.bk-quote .bk-text{border-left:3px solid var(--line);padding-left:12px;color:var(--fg2);border-radius:0}
.bk-callout{background:var(--sunken);border-radius:10px;padding:8px 12px;margin:4px 0}
.bk-todo.done .bk-text{text-decoration:line-through;color:var(--muted)}
.bk .chk{margin-top:.38em;width:16px;height:16px;border-color:var(--faint)}
.bk .chk.on{background:var(--faint)}
.bk-dot{width:6px;height:6px;border-radius:3px;background:var(--fg);margin:.7em 5px 0 6px;flex:none;box-sizing:border-box}
.bk-dot.d1{background:transparent;border:1.5px solid var(--fg)}
.bk-dot.d2{border-radius:1px;width:5px;height:5px;margin-top:calc(.7em + .5px)}
.bk-num{min-width:20px;color:var(--fg2);font-variant-numeric:tabular-nums;padding-top:1px}
.bk-divider{padding:10px 0}
.bk-divider hr{width:100%;border:0;border-top:1px solid var(--line);margin:0}
.bk-link{flex-direction:column;gap:6px;align-items:stretch;padding-block:2px}
.bk-link .bk-text{font-size:13.5px;color:var(--muted)}
.link-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);font-size:14.5px;background:var(--surface)}
.link-card:hover{background:var(--hover)}
.link-card .lc-t{display:flex;flex-direction:column;min-width:0}
.link-card .lc-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-card .lc-t span{font-size:13px;color:var(--muted)}
.link-card .lc-i{width:34px;height:34px;border-radius:8px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.bk-img{position:relative;padding:4px 0}
.bk-img img{width:100%;max-height:440px;object-fit:cover;border-radius:10px;display:block}
.bk-review .bk-img img{width:auto;max-width:100%;max-height:none;object-fit:contain;margin:0 auto}
.bk-img .btn{position:absolute;top:12px;right:8px}
.ed-tail{min-height:28px;cursor:text}
.slash{position:fixed;z-index:80;width:250px;max-height:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px}
.slash button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;font-size:14.5px;text-align:left;cursor:pointer;color:var(--fg)}
.slash button.on,.slash button:hover{background:var(--sunken)}
.slash .si{width:24px;height:24px;border-radius:6px;background:var(--sunken);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--fg2)}
.slash .sk{margin-left:auto;font-size:12.5px;color:var(--muted)}

/* pages */
.page{max-width:980px;margin:0 auto;padding:28px 28px 64px;display:flex;flex-direction:column;gap:18px}
.doc{max-width:740px;width:100%;box-sizing:border-box;margin:0 auto;padding:36px 32px 120px;display:flex;flex-direction:column;gap:12px}
.doc-title{border:0;background:transparent;font-size:32px;font-weight:700;letter-spacing:-.03em;outline:none;padding:0;width:100%;color:var(--fg)}
.h1-input{border:0;background:transparent;font-size:26px;font-weight:700;letter-spacing:-.02em;outline:none;padding:0;width:100%;color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--fg2);background:var(--surface)}
.pill select,.pill input{border:0;background:transparent;font-size:13.5px;outline:none;color:var(--fg)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.fcard{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--fg)}
.fcard:hover{background:var(--hover)}
.fcard svg{color:var(--muted)}
.fcard span.c{margin-left:auto;font-weight:400;color:var(--muted);font-size:13px}
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.drow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line-soft);background:var(--surface);text-align:left;cursor:pointer;color:var(--fg)}
.drow:last-child{border-bottom:0}
.drow:hover{background:var(--hover)}
.drow .dt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.drow .dt b{font-size:15px;font-weight:600}
.drow .dt span{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dm{font-size:13px;color:var(--muted);white-space:nowrap}
.foot-actions{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line-soft)}

/* projects gantt */
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gantt{min-width:900px}
.g-row{display:grid;grid-template-columns:230px repeat(var(--n),minmax(22px,1fr));min-height:52px;border-bottom:1px solid var(--line-soft)}
.g-row:last-child{border-bottom:0}
.g-head{min-height:34px;font-size:12px;color:var(--muted);font-weight:600}
.g-lab{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 12px;border:0;border-right:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;min-width:0;color:var(--fg)}
.g-head .g-lab{cursor:default}
.g-lab .gt{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600}
.g-lab .gt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab .gm{font-size:12.5px;color:var(--muted)}
.pdot{width:8px;height:8px;border-radius:4px;background:var(--pc);flex:none}
.g-cell{grid-row:1;border-right:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center}
.g-cell.we{background:var(--dim)}
.g-cell.today{background:var(--sel)}
.g-day.today span{background:var(--lemon);color:var(--on-lemon);border-radius:9px;padding:1px 5px}
.g-bar{grid-row:1;align-self:center;height:26px;z-index:2;position:relative;border-radius:7px;background:var(--pc-bg);color:var(--pc-ink);font-size:12.5px;font-weight:600;display:flex;align-items:center;padding:0 12px 0 8px;white-space:nowrap;overflow:hidden;cursor:pointer;margin:0 2px}
.g-bar.done{opacity:.6}
.g-bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.g-bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}

/* LIFE */
.lpad{padding:16px 20px 0;display:flex;flex-direction:column;min-height:calc(100% - 62px - var(--foot-gap, 0px));box-sizing:border-box}
.ldow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:13px;font-weight:600;color:var(--muted);padding-bottom:6px}
.ldow span{padding:0 4px}
.lgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,1fr);gap:6px;flex:1}
.lgrid .tile-wrap{display:flex}
.tile-wrap{position:relative;min-width:0}
.tile-add{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:14px;border:0;background:var(--surface);color:var(--fg);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s}
.tile-wrap:hover .tile-add,.tile-add:focus-visible{opacity:1}
@media (hover:none){ .tile-add{opacity:.92;width:24px;height:24px;top:4px;right:4px} }
.tdot{width:6px;height:6px;border-radius:3px;background:var(--faint);margin:0 0 4px 8px}
.tile{width:100%;height:auto;min-height:104px;border:0;border-radius:10px;background-color:var(--dim);background-size:cover;background-position:center;padding:7px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;cursor:pointer;text-align:left;min-width:0;color:var(--fg)}
.tile:hover{box-shadow:inset 0 0 0 1px var(--line)}
.tile.other{opacity:.45}
.tile.sel{box-shadow:0 0 0 2px var(--fg)}
.tile .n{font-size:13px;font-weight:600;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tile.has .n{background:rgba(0,0,0,.55);color:#FFFFFF}
.tile .n.today{background:var(--lemon);color:var(--on-lemon)}
.tile .lb{max-width:100%;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.86);color:#1D1D1F;padding:2px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{display:flex;gap:12px;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;color:var(--fg);margin-bottom:8px}
.rec:hover{background:var(--hover)}
.thumb{width:56px;height:56px;border-radius:8px;flex:none;background-color:var(--sunken);background-size:cover;background-position:center}
.thumb.book{width:40px;height:54px;border-radius:4px}
.rec-tx{display:flex;flex-direction:column;gap:3px;min-width:0;justify-content:center}
.rec-tx b{font-size:15px;font-weight:600}
.rec-tx .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftag{align-self:flex-start;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sunken);color:var(--fg2)}
.dash-btn{width:100%;height:42px;border:1px dashed var(--faint);border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--fg2);cursor:pointer}
.dash-btn:hover{background:var(--hover)}
.cover{height:220px;border-radius:14px;background-color:var(--sunken);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;box-sizing:border-box}
.cover-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.glass{background:rgba(255,255,255,.9);color:#1D1D1F;border:0}
.glass:hover{background:#FFFFFF}
.chk-lbl{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);text-align:left;cursor:pointer;padding:0;color:var(--fg)}
.pcard:hover{box-shadow:var(--shadow-md)}
.pcard .pc-c{aspect-ratio:16/10;background-color:var(--sunken);background-size:cover;background-position:center}
.pcard .pc-t{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.pcard .pc-t b{font-size:15.5px}
.pcard .pc-t span{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipf{height:30px;padding:0 13px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;cursor:pointer;color:var(--fg)}
.chipf.on{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:transparent;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.ccard{display:flex;flex-direction:column;gap:7px;border:0;background:transparent;text-align:left;cursor:pointer;padding:0;color:var(--fg);min-width:0}
.ccard .cv{aspect-ratio:3/4;max-width:100%;border-radius:8px;background-color:var(--sunken);background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(0,0,0,.10)}
.ccard:hover .cv{transform:translateY(-2px)}
.ccard b{font-size:15px;line-height:1.35}
.ccard .s{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sunken);color:var(--fg2)}
.badge.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.badge.hl{background:var(--lemon-soft);color:var(--lemon-ink)}
.stars{color:var(--lemon-ink);letter-spacing:1px;font-size:13px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--dim);border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--hover)}
.tbl .mini-cv{width:32px;height:42px;border-radius:4px;background-size:cover;background-position:center}
.cv-row{display:flex;gap:14px;align-items:center}
.cv-prev{width:72px;height:96px;border-radius:8px;background-color:var(--sunken);background-size:cover;background-position:center;flex:none}
.rate{display:flex;gap:2px}
.rate button{border:0;background:transparent;font-size:18px;color:var(--faint);cursor:pointer;padding:0 2px;line-height:1}
.rate button.on{color:var(--lemon)}
.nc{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.nc-form{flex:999 1 420px;min-width:0;max-width:640px;display:flex;flex-direction:column;gap:22px}
.nc-prev{flex:1 1 220px;max-width:260px;display:flex;flex-direction:column;gap:10px}
.fieldset{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frow2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.frow2.fixed{background:var(--dim);font-size:14.5px;font-weight:600;padding:11px 12px}
.ficon{width:28px;height:28px;border-radius:7px;background:var(--sunken);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--fg2);flex:none}
.frow2 .inp{flex:1}
.frow2 .ty{font-size:13px;color:var(--muted);white-space:nowrap}
.tadd{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;background:var(--ink-btn);color:var(--ink-btn-fg);padding:10px 14px 10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-md);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--ink-btn-fg);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.sres{position:fixed;z-index:75;width:380px;max-width:calc(100vw - 32px);max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px}
.sres .sg{font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px 4px}
.sres button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:var(--fg)}
.sres button:hover{background:var(--sunken)}
.sres button b{font-size:14.5px;font-weight:500}
.sres button.done b{text-decoration:line-through;color:var(--muted)}
.sres button span{font-size:13px;color:var(--muted)}
.nav-scrim{display:none}

@media (max-width:1100px){
  .cal-wrap{flex-direction:column;height:auto;min-height:100%}
  .cal-main,.cal-wrap>.panel{overflow:visible}
  .cal-main{min-height:calc(100vh - 1px)}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  .app.nav-open .side{transform:none}
  .app.nav-open .nav-scrim{display:block;position:fixed;inset:0;z-index:35;background:var(--scrim)}
  .topbar{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .topbar .menu-btn{display:inline-flex}
  .topbar .hint{display:none}
  .page,.doc{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .lpad{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .tile{min-height:64px}
  .lgrid{grid-auto-rows:minmax(64px,1fr)}
  .tile .lb{display:none}
  .cols2{grid-template-columns:minmax(0,1fr)}
}

/* ---- app shell: sign-in gate, sync state ---- */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.gate-box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:380px}
.gate-box .logo-svg{width:88px;height:88px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.gate-box h1{margin:4px 0 0;font-size:28px;letter-spacing:-.03em}
.gate-box p{margin:0;color:var(--muted);line-height:1.65;font-size:15px}
.gbtn{margin-top:8px;height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--ink-btn);color:var(--ink-btn-fg);font-size:15px;font-weight:600;cursor:pointer}
.sync{display:flex;align-items:center;gap:7px;color:var(--fg2);font-weight:600}
.sync-dot{width:8px;height:8px;border-radius:4px;background:var(--faint)}
.sync-dot.ok{background:var(--green)}
.sync-dot.busy{background:var(--lemon)}
.sync-dot.warn{background:var(--rose)}
.foot-row{display:flex;flex-wrap:wrap;gap:4px 12px}
label.link-btn{cursor:pointer}
/* ---- week view + weekly log ---- */
.btn.on-soft{background:var(--lemon-soft);color:var(--lemon-ink);border-color:transparent;font-weight:600}
.dow .tdow{color:var(--lemon-ink)}
.wlog{padding:18px 20px 32px;display:flex;flex-direction:column;gap:16px}
.wlog-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:14px;color:var(--muted)}
.wlog-sum b{font-size:22px;color:var(--fg);margin-right:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wlog-ps{display:flex;flex-wrap:wrap;gap:6px}
.wlog-grid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.wlog-days{flex:999 1 420px;min-width:0;display:flex;flex-direction:column}
.wlog-note{flex:1 1 260px;max-width:100%;position:sticky;top:80px}
.lday{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.lday:last-child{border-bottom:0}
.lday-h{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.lday-h b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;padding:0 6px;border-radius:10px}
.lday-h span{font-size:13px;color:var(--muted)}
.lday.is-today .lday-h b{background:var(--lemon);color:var(--on-lemon)}
.lday.empty-day{padding:8px 0;align-items:center}
.lday.empty-day .lday-h{flex-direction:row;gap:6px;justify-content:center}
.lday.empty-day .lday-h b{font-size:15px;color:var(--muted)}
.lday-b{display:flex;flex-direction:column;gap:2px;min-width:0;justify-content:center}
.lrow{display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 8px;border:0;border-radius:9px;background:transparent;text-align:left;cursor:pointer;color:var(--fg)}
.lrow:hover{background:var(--hover)}
.lic{width:16px;height:16px;border-radius:5px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;border:1.5px solid var(--faint);box-sizing:border-box}
.lic svg{opacity:0}
.lic.dn{background:var(--green);border-color:var(--green)}
.lic.dn svg{opacity:1}
.lic.ev{border:0;width:8px;height:8px;border-radius:4px;margin:6px 4px 0}
.ltx{display:flex;flex-direction:column;gap:2px;min-width:0}
.lt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:15px}
.lt b{font-weight:500}
.lm{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* ---- sub-todos ---- */
.prog{flex:none;display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:5px;background:var(--sunken);color:var(--muted);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;vertical-align:1px}
.prog.all{background:var(--green-soft);color:var(--green-ink)}
.subic{color:var(--muted);margin-right:3px}
.ptl{display:none;font-size:12px;color:var(--muted);line-height:1.3}
.ptl.show,.wk.sel .chip .ptl{display:block}
.parent-link{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--sunken);border-radius:8px;padding:5px 10px;font-size:13.5px;color:var(--fg2);cursor:pointer}
.parent-link span{color:var(--blue-ink);font-weight:600}
.subs{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.subs-h{display:flex;align-items:center;gap:10px;padding:0 2px 4px}
.pbar{flex:1;max-width:160px;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--green);border-radius:3px}
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:12px 14px;border-radius:12px;background:var(--sunken)}
.set-row>div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px}
.set-row>div.seg,.set-row>div.accents{flex-direction:row;flex:0 0 auto}
.set-row>div.accents{gap:8px;flex-wrap:wrap;justify-content:flex-end}
.set-row b{font-size:15px}
/* ---- reminder cards ---- */
.rcards{position:fixed;top:calc(16px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));z-index:95;display:flex;flex-direction:column;gap:10px;width:360px;max-width:calc(100vw - 32px);pointer-events:none}
.rcard{pointer-events:auto;display:flex;gap:12px;padding:14px 14px 14px 14px;background:var(--surface);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.22),0 0 0 1px var(--line);border-left:4px solid var(--lemon);animation:rcin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rcin{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.rc-ic .logo-svg{width:40px;height:40px;border-radius:12px}
.rc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rc-top{display:flex;align-items:center;justify-content:space-between}
.rc-kind{font-size:12.5px;font-weight:700;color:var(--lemon-ink);letter-spacing:.02em}
.rc-t{font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.35;word-break:break-word}
.rc-b{font-size:14px;color:var(--muted)}
.rc-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (prefers-reduced-motion: reduce){ .rcard{animation:none} }
.side-foot{flex-direction:row;align-items:center;gap:8px}
.side-foot .sync{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-bell{font-size:12px;font-weight:600;color:var(--lemon-ink);background:var(--lemon-soft);border-radius:6px;padding:1px 7px;white-space:nowrap}
.gear-btn{flex:none;width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.gear-btn:hover{background:var(--hover);color:var(--fg)}
.set-sec{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;padding:2px 2px 8px}
.set-row+.set-row{margin-top:8px}
/* ---- pane resizers ---- */
.rz{position:relative;z-index:6;cursor:col-resize;touch-action:none}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:transparent;transition:background .15s}
.rz:hover::after,.rz.on::after,.rz:focus-visible::after{background:var(--blue)}
.rz:focus-visible{outline:none}
.rz-side{position:absolute;top:0;bottom:0;left:calc(var(--side-w, 252px) - 4px);width:8px}
.rz-panel{flex:none;width:8px;margin:0 -4px;align-self:stretch}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none}
@media (max-width:1100px){ .rz-panel{display:none} }
@media (max-width:860px){ .rz-side{display:none} }
/* ---- folder drag & drop ---- */
.tree-row[draggable="true"]{cursor:default}
.tree-row.drop-before{box-shadow:inset 0 2px 0 var(--blue)}
.tree-row.drop-after{box-shadow:inset 0 -2px 0 var(--blue)}
.tree-row.drop-hi{background:var(--blue-soft)!important;outline:1.5px solid var(--blue);outline-offset:-1.5px}
.sec-head.drop-hi{background:var(--blue-soft);border-radius:6px;outline:none}
/* ---- code ---- */
code.ic{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'D2Coding', monospace;font-size:.86em;background:var(--ic-bg);color:var(--ic-fg);border-radius:4px;padding:.15em .38em;line-height:1.4}
.icm{font-size:0!important;letter-spacing:0}
:root{--ic-bg:rgba(135,131,120,.15);--ic-fg:#EB5757}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ic-bg:rgba(135,131,120,.24);--ic-fg:#FF7369 } }
.bk-code{flex-direction:column;align-items:stretch;gap:0;margin:6px 0;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line-soft);overflow:hidden}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 0 14px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.code-copy{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:6px;padding:3px 8px;cursor:pointer}
.code-copy:hover{background:var(--hover);color:var(--fg)}
.bk-code .code-text{font-family:ui-monospace, 'Cascadia Code', Consolas, 'D2Coding', monospace;font-size:14px;line-height:1.6;padding:6px 14px 12px;white-space:pre-wrap;tab-size:2;overflow-x:auto;width:100%;box-sizing:border-box}
/* ---- table block ---- */
.bk-table{flex-direction:column;align-items:stretch;gap:4px;margin:6px 0}
.tbl-scroll{overflow-x:auto;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.etbl{border-collapse:collapse;width:100%;min-width:100%;font-size:.94em}
.etbl td{border:1px solid var(--line);vertical-align:top;min-width:96px;padding:0}
.etbl tr:first-child td{border-top:0}
.etbl tr:last-child td{border-bottom:0}
.etbl td:first-child{border-left:0}
.etbl td:last-child{border-right:0}
.etbl td.th{background:var(--sunken);font-weight:600}
.tcell{outline:none;padding:7px 10px;min-height:1.6em;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.tcell:focus{box-shadow:inset 0 0 0 2px var(--blue);border-radius:2px}
.tbl-tools{display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .15s}
.bk-table:hover .tbl-tools,.bk-table:focus-within .tbl-tools{opacity:1}
.tbl-tools button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:6px;padding:3px 8px;cursor:pointer}
.tbl-tools button:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.tbl-tools button:disabled{opacity:.4;cursor:default}
.tbl-hint{font-size:12.5px;color:var(--faint);margin-right:6px}
@media (hover:none){ .tbl-tools{opacity:1} .tbl-hint{display:none} }
/* ---- mentions & links ---- */
.mention{display:inline-flex;align-items:center;gap:3px;max-width:100%;vertical-align:baseline;border:0;border-radius:7px;padding:0 7px;margin:0 1px;font-size:.92em;font-weight:600;line-height:1.6;background:var(--blue-soft);color:var(--blue-ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.mention:hover{filter:brightness(.97);text-decoration:underline;text-underline-offset:2px}
.mention.m-td{background:var(--green-soft);color:var(--green-ink)}
.mention.m-doc,.mention.m-post{background:var(--sunken);color:var(--fg2)}
.mention.m-project{background:var(--lemon-soft);color:var(--lemon-ink)}
.mention.gone{background:var(--sunken);color:var(--faint);text-decoration:line-through}
.links{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.links-h{display:flex;align-items:center;justify-content:space-between}
.links-list{display:flex;flex-wrap:wrap;gap:6px}
.links-list .mention{font-size:13.5px;line-height:1.9}
.mpick .mp-h{font-size:12.5px;font-weight:700;color:var(--muted);padding:4px 8px 6px}
.mpick button{height:auto;min-height:40px;padding:5px 8px}
.dlg-body .links{border-top:0;margin-top:2px;padding-top:6px}
.mention .unlink{margin-left:4px;opacity:.45;font-size:11px;padding:0 2px;border-radius:4px}
.mention .unlink:hover{opacity:1;background:rgba(0,0,0,.08)}
.links.panel{width:100%;box-sizing:border-box;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:4px 0 14px;padding:10px 12px;border:0;border-radius:12px;background:var(--sunken)}
.links-pill{cursor:pointer;color:var(--faint);gap:4px}
.links-pill.has{color:var(--fg2)}
.links-pill.on{background:var(--blue-soft);color:var(--blue-ink)}
.links-pill svg{width:14px;height:14px}
.links-pill .caret{font-size:11px;margin-left:2px}
/* ---- toggle block ---- */
.bk-tg{flex:none;width:22px;height:22px;margin:.15em 2px 0 0;border:0;border-radius:5px;background:transparent;color:var(--fg2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s}
.bk-tg svg{width:11px;height:11px}
.bk-tg.closed{transform:rotate(-90deg)}
.bk-tg:hover{background:var(--hover)}
.tg-empty{color:var(--faint);font-size:.92em;cursor:text;padding-top:2px;padding-bottom:2px;padding-left:calc(var(--ind,0) * 26px + 2px)}
.tg-empty:hover{color:var(--muted)}
/* ---- event status & postpone ---- */
.evck{flex:none;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;padding:0;border:0;background:transparent;cursor:pointer;border-radius:4px;color:var(--chip)}
.evck svg{display:none;width:10px;height:10px}
.chip.ev:hover .evck{background:color-mix(in srgb, var(--chip) 22%, transparent)}
.chip.ev:hover .evck .dot{display:none}
.chip.ev:hover .evck svg,.chip.ev.done .evck svg{display:block}
.chip.ev.done .evck .dot{display:none}
.chip.ev.done{opacity:.55}
.chip.ev.done .tt{color:var(--muted);text-decoration:none}
.chip.ev.cancel{background:transparent;opacity:.6}
.chip.ev.cancel .tt,.chip.ev.cancel .tm{text-decoration:line-through;color:var(--muted)}
.chip.ev.cancel .dot{background:var(--faint)!important}
.bar.ev.done{opacity:.55}
.bar.ev.cancel{opacity:.55}
.bar.ev.cancel .bt{text-decoration:line-through}
.evrow.done{opacity:.6}
.evrow.cancel{background:var(--sunken)}
.evrow.cancel .et b{text-decoration:line-through;color:var(--muted)}
.evrow.cancel .eb{background:var(--faint)!important}
.stb{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:0 6px;border-radius:5px;background:var(--sunken);color:var(--muted);text-decoration:none;vertical-align:1px}
.stb.ok{background:var(--green-soft);color:var(--green-ink)}
.mvb{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:0 6px;border-radius:5px;background:var(--lemon-soft);color:var(--lemon-ink);text-decoration:none;vertical-align:1px;white-space:nowrap}
.mvi{flex:none;font-size:12px;color:var(--lemon-ink);margin-left:2px}
.seg button.st-cancel{color:var(--rose-ink)}
.mv-pick{position:relative;overflow:hidden}
.mv-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.dow .sun,.ldow .sun{color:var(--rose-ink)}
.dow .sat,.ldow .sat{color:var(--blue-ink)}
/* ---- phone layout ---- */
.tabbar,.fab{display:none}

  .main{padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px))}

  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tabbar button svg{width:21px;height:21px}

  .fab svg{width:22px;height:22px}
  .topbar{gap:8px;flex-wrap:nowrap}

.cell{position:relative}

  .mgroup{display:flex;flex-direction:column;gap:6px}
  .mg-h{font-size:13px;font-weight:700;color:var(--muted);padding:0 6px;letter-spacing:.02em}
  .mg-b{background:var(--surface);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--line-soft);overflow:hidden}
  .mrow{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:56px;padding:10px 14px;border:0;background:transparent;text-align:left;font:inherit;color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mrow+.mrow{border-top:1px solid var(--line-soft)}

  .mtime{width:42px;flex:none;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;line-height:1.25}

  .mtime small{font-size:12.5px;color:var(--faint)}
  .mbar{width:4px;align-self:stretch;border-radius:2px;flex:none;min-height:28px}
  .mtx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;border:0;background:transparent;text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer}

  .mtx>span{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .mtx>span i{font-style:normal;color:var(--faint)}
  .mtx em{font-style:normal;font-weight:700;font-size:12.5px;border-radius:5px;padding:0 6px}
  .mtx em.st{background:var(--sunken);color:var(--muted)}
  .mtx em.st.ok{background:var(--lemon-soft);color:var(--lemon-ink)}
  .mtx em.mv{background:var(--lemon-soft);color:var(--lemon-ink)}
  .mtx .pt{font-weight:600;color:var(--pc-ink)}
  .mrow.td .chk{width:22px;height:22px;flex:none;border-radius:11px}
  .mrow.td.done .mtx b{text-decoration:line-through;color:var(--muted)}
  .mrow.ev.done{opacity:.55}
  .mrow.ev.cancel .mtx b{text-decoration:line-through;color:var(--muted)}
  .tabbar{padding-top:4px}
  .tabbar button{gap:2px;font-size:12px}
  .tabbar .ti{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px;transition:background .15s}
  .tabbar .ti svg{width:20px;height:20px}
  .tabbar button.on .ti{background:var(--lemon-soft);color:var(--on-lemon)}
  .tabbar .ti b{position:absolute;top:0;right:6px;min-width:16px;height:16px;line-height:16px;text-align:center;font-size:11px;background:var(--fg);color:var(--bg);border-radius:8px;padding:0 4px;box-sizing:border-box}
  .fab{background:var(--lemon);color:var(--on-lemon);box-shadow:0 8px 22px rgba(160,130,0,.28)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px));max-width:calc(100vw - 32px);white-space:nowrap}
  .mprojs .tag{box-shadow:none;border:0}
}
/* ---- inline rename ---- */
.rn-edit{outline:none;background:var(--surface);color:var(--fg)!important;box-shadow:0 0 0 2px var(--lemon);border-radius:4px;padding:0 3px;white-space:normal!important;text-decoration:none!important;cursor:text;user-select:text;-webkit-user-select:text;display:inline-block;min-width:3em}

/* ---- quick sub-todos ---- */
.subplus{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:var(--muted);opacity:0;cursor:pointer;margin-left:auto}
.subplus svg{width:13px;height:13px}
.trow:hover .subplus,.evrow:hover .subplus,.subplus:focus-visible{opacity:1}
.subplus:hover{background:var(--hover);color:var(--fg)}
.evrow{align-items:stretch}
.evrow .subplus{align-self:center}
.sub-inline{display:flex;align-items:center;gap:6px;margin:2px 0 6px 26px;padding:0 8px;height:32px;border-radius:8px;background:var(--sunken)}
.sub-inline .si-ic{color:var(--muted);font-size:14px}
.sub-inline input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--fg)}
.chip-sub{display:none;flex:none;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;color:var(--muted);margin-left:2px;cursor:pointer}
.chip-sub svg{width:9px;height:9px}
.chip:hover .chip-sub{display:inline-flex}
.chip-sub:hover{background:var(--hover);color:var(--fg)}
.qc-par{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (hover:none){ .subplus{opacity:.55} .chip-sub{display:none!important} }
@media (max-width:640px){
  .mrow .subplus{opacity:.5;width:30px;height:30px;margin-left:4px}
  .mrow .subplus svg{width:13px;height:13px}

  .sub-inline input{font-size:15.5px}
}
/* ---- clearer sub + and a bigger chosen day ---- */
.chip-sub{position:absolute!important;right:6px;top:50%;transform:translateY(-50%);width:20px!important;height:20px!important;margin:0!important;border-radius:6px!important;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);color:var(--fg)!important;z-index:3}
.chip-sub svg{width:12px!important;height:12px!important}
.chip:hover .chip-sub,.bar:hover .chip-sub{display:inline-flex!important}
.bar .chip-sub{display:none}
.chip:hover .tt{padding-right:22px}
.chip.ev .handle{z-index:4}
.dow,.wk{transition:grid-template-columns .18s ease}
.cell.selday .num{font-size:15px;height:26px;min-width:26px;border-radius:13px}
.cell.selday .chip,.cell.selday ~ .items .chip{font-size:13.5px}
/* ---- diary grouping ---- */
.ptools{display:flex;align-items:center;gap:8px;margin:6px 0 4px}

.pyear{margin-top:8px;scroll-margin-top:70px}

.plines{display:flex;flex-direction:column;gap:6px}
.pline{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);border-radius:14px;padding:10px 14px;text-align:left;font:inherit;color:var(--fg);cursor:pointer}

/* ---- polish pass ---- */

body{letter-spacing:-.003em;line-height:1.5;font-weight:450;text-rendering:optimizeLegibility}

.title-input{font-size:24px}

.lbl{letter-spacing:.02em}

.bk-title{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.bk-sub{font-size:14px;color:var(--muted)}.bk-sub i{font-style:normal;margin:0 6px;color:var(--faint)}
.bk-tags{display:flex;gap:8px;align-items:center}
.bk-st{font-size:12.5px;font-weight:700;background:var(--lemon-soft);color:var(--lemon-ink);border-radius:20px;padding:2px 10px}
.bk-star{color:var(--lemon-strong);letter-spacing:1px}
.bk-prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bk-bar{width:200px;max-width:40vw;height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;box-shadow:var(--nm-in-sm, none)}
.bk-bar i{display:block;height:100%;background:var(--lemon);border-radius:4px}
.bk-pn{font-weight:700;color:var(--fg2)}
.bk-tot{width:58px;height:26px;border:0;border-radius:8px;background:var(--bg);box-shadow:var(--nm-in-sm, inset 0 0 0 1px var(--line));font:inherit;font-size:13px;color:var(--fg);padding:0 6px;margin:0 3px}
.bk-tabs{margin-bottom:16px}
.bn-comp{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.bn-comp textarea{flex:1 1 320px;min-height:44px;resize:vertical;border:0;border-radius:14px;background:var(--bg);box-shadow:var(--nm-in-sm, inset 0 0 0 1px var(--line));padding:11px 14px;font:inherit;font-size:15px;color:var(--fg);line-height:1.5;outline:none}
.bn-comp textarea:focus{box-shadow:var(--nm-in-sm, none),0 0 0 2px var(--lemon)}
.bn-p{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.bn-p input{width:60px;height:32px;border:0;border-radius:10px;background:var(--bg);box-shadow:var(--nm-in-sm, inset 0 0 0 1px var(--line));font:inherit;font-size:14px;color:var(--fg);padding:0 8px}
.bn-list{display:flex;flex-direction:column;gap:8px;max-width:760px}
.bn-day{font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 2px 0}
.bn{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--nm-out-xs, var(--shadow))}
.bn-pg{width:46px;flex:none;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.bn-t{flex:1;font-size:15px;line-height:1.6;min-width:0;word-break:break-word}
.bn.quote .bn-t{color:var(--fg2);font-style:italic;border-left:3px solid var(--lemon);padding-left:10px}
.bn-x{flex:none;width:24px;height:24px;border:0;background:transparent;color:var(--faint);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0}
.bn:hover .bn-x,.bth:hover .bn-x,.bn-x:focus-visible{opacity:1}
.bn-x:hover{color:var(--fg);background:var(--hover)}
.bk-rtools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bk-review{padding:14px 18px;min-height:240px}
.bm-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:stretch}
.board{position:relative;height:min(66vh,620px);border-radius:20px;background:var(--bg);box-shadow:var(--nm-in, inset 0 0 0 1px var(--line));overflow:hidden;touch-action:none;cursor:grab;outline:none;background-image:radial-gradient(circle, var(--line) 1px, transparent 1.2px);background-size:22px 22px}
.board:active{cursor:grabbing}
.blayer{position:absolute;left:0;top:0;transform-origin:0 0}
.bedges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.bedges line{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.bedges line.sel{stroke:var(--lemon-ink);stroke-width:3}
.bedges line.btemp{stroke:var(--lemon-ink);stroke-dasharray:6 5}
.bnode{position:absolute;width:132px;min-height:58px;box-sizing:border-box;padding:9px 12px;border-radius:16px;background:var(--surface);box-shadow:var(--nm-out-sm, var(--shadow-md));display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:grab;user-select:none;-webkit-user-select:none;border-top:4px solid transparent}
.bnode b{font-size:14.5px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnode span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnode.sel{outline:2.5px solid var(--lemon);outline-offset:2px}
.bnode.c-rose{border-top-color:var(--rose)} .bnode.c-blue{border-top-color:var(--blue)} .bnode.c-green{border-top-color:var(--green)} .bnode.c-violet{border-top-color:var(--violet)} .bnode.c-lemon{border-top-color:var(--lemon-strong)}
.bhandle{position:absolute;right:-8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--lemon);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:crosshair;opacity:.25;transition:opacity .12s}
.bnode:hover .bhandle,.bnode.sel .bhandle{opacity:1}
.bedge{position:absolute;transform:translate(-50%,-50%);border:0;font:inherit;font-size:12px;font-weight:700;color:var(--fg2);background:var(--bg);border-radius:20px;padding:3px 9px;box-shadow:var(--nm-out-xs, var(--shadow));cursor:pointer;white-space:nowrap;z-index:1}
.bedge.nol{color:var(--faint);font-weight:600}
.bedge.sel{background:var(--lemon);color:var(--on-lemon)}
.bm-empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:14px;line-height:1.7;pointer-events:none}
.bctl{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.bpanel{background:var(--surface);border-radius:20px;box-shadow:var(--nm-out, var(--shadow-md));padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-height:min(66vh,620px);overflow-y:auto}
.bpanel .inp{width:100%;box-sizing:border-box;height:36px}
.bp-hint{color:var(--muted);font-size:13.5px;line-height:1.6;justify-content:center}
.bp-hint b{color:var(--fg)}
.bp-h{display:flex;align-items:center;gap:8px}
.bp-h b{flex:1;font-size:15px}
.bp-name{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:20px;font-weight:800;color:var(--fg);outline:none;padding:2px 0}
.bp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bp-colors{display:flex;gap:6px}
.bp-c{width:20px;height:20px;border-radius:50%;border:0;cursor:pointer;background:var(--surface);box-shadow:var(--nm-out-xs, inset 0 0 0 1px var(--line))}
.bp-c.c-rose{background:var(--rose)} .bp-c.c-blue{background:var(--blue)} .bp-c.c-green{background:var(--green)} .bp-c.c-violet{background:var(--violet)} .bp-c.c-lemon{background:var(--lemon-strong)}
.bp-c.on{outline:2.5px solid var(--fg);outline-offset:2px}
.bp-rels{display:flex;flex-wrap:wrap;gap:6px}
.bp-rel{border:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--fg2);background:var(--sunken);border-radius:20px;padding:3px 10px;cursor:pointer}
.bp-chips{display:flex;flex-wrap:wrap;gap:6px}
.bp-th{display:flex;flex-direction:column;gap:6px}
.bth{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid var(--line-soft)}
.bth-m{width:44px;flex:none;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.35}
.bth-t{flex:1;font-size:14px;line-height:1.55}
.bth-add{display:flex;gap:6px;align-items:center}
.bth-add .bn-p input{width:50px}
.bp-seen{display:flex;flex-direction:column;gap:6px}
.bps{font-size:13px;line-height:1.5;color:var(--fg2)}
.bps span{font-weight:700;color:var(--muted);margin-right:6px;font-size:12px}
.bps.quote{font-style:italic}
@media (max-width:860px){ .bm-wrap{grid-template-columns:minmax(0,1fr)} .board{height:56vh} .bpanel{max-height:none} }
@media (max-width:640px){ .bk-head{gap:14px} .bk-cover{width:72px;height:104px} .bk-title{font-size:21px} .bk-bar{width:120px} .bn-x{opacity:.6} .bnode{width:118px} }
/* ---- 책: 끄적임과 관계도를 나란히 ---- */
.bk-read{display:grid;grid-template-columns:minmax(300px,2fr) minmax(0,3fr);gap:20px;align-items:start}
.bk-col-notes{min-width:0;display:flex;flex-direction:column}
.bk-col-notes .bn-comp{flex-direction:column;align-items:stretch}
.bk-col-notes .bn-comp>.seg,.bk-col-notes .bn-comp>.bn-p{align-self:flex-start}
.bk-col-notes .bn-comp>.seg{margin-bottom:-2px}
.bk-col-notes .bn-comp textarea{flex:none;min-height:64px}
.bk-col-notes .bn-list{max-height:calc(100vh - 470px);min-height:160px;overflow-y:auto;padding:4px 4px 10px;margin:-4px}
.bk-col-map{position:sticky;top:76px;min-width:0}
.bk-read .bm-wrap{display:block;position:relative}
.bk-read .board{height:calc(100vh - 330px);min-height:420px}
.bk-read .bpanel{max-height:none}
.bk-col-notes .bpanel{position:relative}
.bn-comp .bn-row{display:flex;gap:10px;align-items:center}
@media (max-width:1100px){ .bk-read{grid-template-columns:minmax(0,1fr)} .bk-col-map{position:static} .bk-col-notes .bn-list{max-height:none} .bk-read .board{height:60vh} }

/* ---- 꼭 잊지 말기 ---- */
.imp{color:var(--rose);font-size:.85em;margin-right:3px;font-weight:800}
.chip.star{box-shadow:none}
.chip.ev.star{box-shadow:var(--nm-out-xs, none)}
.impbtn.on{color:var(--rose-ink)!important;background:var(--rose-soft)!important}
.starcard{border-left:0}
.starcard .card-title{color:var(--rose-ink)}
.slist{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.srow{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-radius:10px}
.srow{align-items:center}
.stl>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;min-width:0}
.stl .sw{white-space:nowrap;flex:none;width:auto;height:auto;border:0;border-radius:0;background:none;padding:0;cursor:inherit}
.stl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--fg);text-align:left;cursor:pointer;padding:0}

.sw.today{color:var(--lemon-ink);font-weight:700}
.sw.late{color:var(--rose-ink);font-weight:700}
.sdot{width:8px;height:8px;border-radius:4px;background:var(--blue);margin:0 4px;flex:none}
.tree-doc.loose{margin-top:2px}
/* ---- routines: changes, calendar, holidays ---- */
.rch{font-size:12px;color:var(--rose-ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.rchg{display:flex;flex-direction:column;gap:6px}

.rchg em,.rap em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.rchg .inp{width:100%;box-sizing:border-box;height:36px;margin-top:2px}
.rap input{margin-top:4px;width:16px;height:16px;accent-color:var(--lemon-strong)}
.rapplied{font-size:13px;color:var(--muted);margin-top:8px}
.rapplied summary{cursor:pointer;font-weight:600}
.rapplied div{padding:3px 0 0 14px}
.chip.rt{background:var(--lemon-soft);color:var(--lemon-ink)}
.chip.rt .rti{display:flex;flex:none}.chip.rt .rti svg{width:11px;height:11px}
.chip.rt .tt{font-weight:600}
.num.hol{color:var(--rose-ink)!important}
.holi{font-size:11px;color:var(--rose-ink);font-weight:600;margin-left:4px}
.offlist{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 6px}
.offlist span{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:600;background:var(--sunken);border-radius:20px;padding:2px 4px 2px 10px}

.rtrow.done .dr-t{color:var(--muted);text-decoration:line-through}
.rtrow .chk{border-radius:50%}
/* ---- 확인할 것 ---- */
.chkcard .card-title{display:flex;align-items:center;gap:6px;color:var(--lemon-ink)}
.chkcard .card-title .grow{flex:1}
.cg{margin-top:6px}
.cg-h{font-size:12.5px;font-weight:700;color:var(--muted);padding:4px 4px 2px}
.crow{display:flex;align-items:flex-start;gap:9px;width:100%;border:0;background:transparent;font:inherit;color:var(--fg);text-align:left;cursor:pointer;padding:6px 4px;border-radius:10px;line-height:1.45}
.crow:hover{background:var(--lemon-soft, color-mix(in srgb, var(--lemon) 22%, transparent))}
.cdot{width:7px;height:7px;border-radius:4px;background:var(--lemon-strong);margin-top:7px;flex:none}
.ct{font-weight:600}
.starbtn{opacity:0;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:6px;filter:grayscale(1);transition:opacity .15s;flex:none}
.trow:hover .starbtn,.mrow:hover .starbtn,.starbtn:focus-visible{opacity:.55}
.starbtn:hover{opacity:1!important;filter:none}
.starbtn.on{opacity:1;filter:none}
@media (hover:none){.starbtn{opacity:.35}.starbtn.on{opacity:1}}
/* ---- 잊지 말 것 띠 ---- */
.sstrip{display:flex;align-items:center;gap:12px;margin:2px 0 12px;padding:8px 10px 8px 14px;border-radius:14px;background:var(--rose-soft);min-width:0}
.ss-l{flex:none;font-weight:800;font-size:13.5px;color:var(--rose-ink)}
.ss-list{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px}
.ss-list::-webkit-scrollbar{display:none}
.spill{display:flex;align-items:center;gap:6px;flex:none;background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;box-shadow:0 1px 3px rgba(60,70,90,.08)}

.spill .sdot{margin:0 3px}
.sp-t{display:flex;align-items:center;gap:7px;border:0;background:none;font:inherit;color:var(--fg);cursor:pointer;padding:0;max-width:260px}
.sp-n{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ssw{font-size:12px;color:var(--muted);white-space:nowrap}
.ssw.today{color:var(--lemon-ink);font-weight:700}
.ssw.late{color:var(--rose-ink);font-weight:700}
.chip.star:not(.done){background:var(--rose-soft)!important}
@media (max-width:860px){ .sstrip{margin:4px 12px 8px;padding:7px 8px 7px 12px;gap:8px} .ss-l{font-size:12.5px} .sp-n{font-size:13.5px} }
.ichk{display:flex;gap:6px;align-items:flex-start;margin:-2px 0 4px 34px;padding:3px 10px;border-radius:8px;background:var(--rose-soft);color:var(--rose-ink);font-size:13px;font-weight:600;line-height:1.45;cursor:pointer}
.ichk i{font-style:normal;opacity:.5;margin:0 5px}
.ichk-m{flex:none;font-size:11px;margin-top:2px}
#ic-in{margin-bottom:12px}
.mlist .ichk{margin:-4px 14px 6px 50px}
.chip.has-ck{flex-wrap:wrap;row-gap:1px}
.chip.has-ck>*{flex-shrink:0}
.chip.has-ck .tt{flex:1 1 0;min-width:0}
.chip-ck{flex:1 0 100%;order:9;font-size:11.5px;font-weight:600;color:var(--rose-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px 1px 4px;line-height:1.35}
.bar-ck{font-size:11.5px;font-weight:700;color:var(--rose-ink);background:var(--rose-soft);border-radius:6px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;margin-left:6px}
.pri{display:inline-block;font-size:10.5px;font-weight:800;line-height:1;padding:3px 5px;border-radius:5px;margin-right:4px;vertical-align:1px;letter-spacing:-.02em}
.pri.p1{background:var(--rose-soft);color:var(--rose-ink)}
.pri.p2{background:var(--lemon-soft);color:var(--lemon-ink)}
.pri.p3{background:rgba(135,131,120,.16);color:var(--muted)}
.chip .pri{font-size:10px;padding:2px 4px;margin-right:3px}
#ig-ok:disabled{opacity:.45;cursor:not-allowed}
.ck-ed{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);padding:3px 6px;border-radius:7px;outline:none}
.ck-ed:hover{background:var(--hover, rgba(0,0,0,.04))}
.ck-ed:focus{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--lemon)}
.ck-date{font-style:normal;font-size:12px;color:var(--faint);flex:none}
.rchg-i{align-items:center}
.dlg-ask{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--lemon-soft);color:var(--lemon-ink);font-size:14px}
.savebtn{margin-right:6px}
/* rows grow with their items instead of spilling into the next week */
.wk{flex:1 0 auto}
.wk.sel{flex:1.7 0 auto}
.cal-main{min-height:0}
.cal-main>.cal-scroll{overflow-y:auto}
.atag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;margin-right:4px;vertical-align:1px;background:rgba(135,131,120,.14);color:var(--fg2)}
.atag b{color:var(--rose-ink);font-weight:800}
.chip .atag{font-size:10px;padding:2px 4px;margin-right:3px}
.awarn{margin:6px 0 12px;padding:10px 12px;border-radius:12px;background:var(--rose-soft)}
.awarn-h{font-size:13px;font-weight:800;color:var(--rose-ink);margin-bottom:4px}
.awarn-h span{font-weight:600;opacity:.7}
.awarn-r{display:flex;gap:8px;width:100%;border:0;background:none;font:inherit;font-size:14px;color:var(--fg);text-align:left;padding:4px 2px;cursor:pointer;line-height:1.45}
.awarn-r b{color:var(--rose-ink);font-weight:700;flex:none}
.awarn-r em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);flex:none}
.area-item .hash,.h1 .hash{color:var(--faint);font-weight:700;margin-right:2px}
.area-item .aw{margin-left:auto;font-size:11px;font-weight:800;color:var(--rose-ink)}

.area-new{padding:2px 10px 6px}

.area-page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding:0 24px 30px 4px;align-items:start}
.arow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:10px}

.area-h{display:flex;align-items:center}
.area-name{border:0;background:transparent;font:inherit;color:inherit;padding:2px 6px;border-radius:8px;width:auto;min-width:3ch;field-sizing:content;outline:none}
.area-name:hover{background:var(--hover, rgba(0,0,0,.04))}
.area-name:focus{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--lemon)}
.jbtn{margin-left:auto}
.day-h{display:flex;align-items:center;gap:8px}
.ilog{display:flex;flex-direction:column;gap:2px}
.ilog-i{display:flex;align-items:center;gap:8px;padding:2px 0}
.ilog-t{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px}

.jrow:last-child{border-bottom:0}
.jrow-h{display:flex;align-items:center;gap:8px;padding:4px 4px}
.jst{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(135,131,120,.14);color:var(--fg2)}
.jst.ok{background:var(--lemon-soft);color:var(--lemon-ink)}

.jnote{min-height:220px}
@media (max-width:640px){ .h1 .muted{display:none} }
@media (max-width:900px){ .jpage{grid-template-columns:minmax(0,1fr);padding:0 12px 40px} }
.jls{padding:0 24px 40px;max-width:860px;margin:0 auto;width:100%}
.jl-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.jl-list{padding:4px}
.jl-row{display:grid;grid-template-columns:76px 110px minmax(0,1fr);align-items:center;gap:10px;width:100%;border:0;background:none;font:inherit;color:var(--fg);text-align:left;padding:10px 10px;border-radius:10px;cursor:pointer}

.jl-n{font-size:13px;color:var(--muted)}
.jl-p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--fg2)}
.jf-day{margin-bottom:12px}

.jf-it{padding:4px 4px 6px}
.jf-t{display:flex;align-items:center;gap:6px;font-weight:700}

@media (max-width:640px){ .jl-row{grid-template-columns:62px minmax(0,1fr)} .jl-n{display:none} .jls{padding:0 12px 40px} }
.jtree{margin:2px 0 4px;font-weight:700}
.jtree .cnt{margin-left:auto}
.jmark{position:relative;z-index:4;border:0;background:none;padding:1px 3px;margin-left:2px;cursor:pointer;color:var(--lemon-ink);opacity:.8;vertical-align:middle;border-radius:5px;line-height:0}
.jmark svg{width:13px;height:13px}
.jmark:hover{opacity:1;background:var(--lemon-soft)}
.jl-q{display:flex;margin:0 0 12px}
.jl-q input{flex:1}
#jl-res mark{background:var(--lemon);color:var(--on-lemon);border-radius:3px;padding:0 1px}
.jorig{flex:none;font-size:11.5px;color:var(--muted);margin-left:4px}
.jrow .stl{justify-content:flex-start}
.jrow .stl .jst{margin-left:auto}
.ccomp{display:flex;align-items:flex-end;gap:8px;padding:6px 8px;border-radius:12px;background:var(--surface);box-shadow:var(--nm-in-sm, inset 0 0 0 1px var(--line))}
.ccomp-ed{flex:1;min-width:0}
