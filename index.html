.ccomp{align-items:center}
.jpage,.jls{box-sizing:border-box}
.ilog-i{align-items:flex-start}
.ilog-i .ilog-t{padding-top:5px;line-height:1.3}
.ilog-ed{flex:1;min-width:0}
.jlog-ed{align-items:flex-start}
.jlog-ed .ilog-t{padding-top:4px}
.jadd{padding:4px 6px 2px 34px}
.cadd{display:inline-flex;align-items:center;gap:4px;border:0;background:none;font:inherit;font-size:13px;color:var(--faint);cursor:pointer;padding:3px 6px;border-radius:7px}
.cadd svg{width:13px;height:13px}
.cadd:hover{color:var(--fg2);background:var(--hover, rgba(0,0,0,.04))}
.jrow:not(:hover) .jadd .cadd{opacity:.6}
.jadd{padding:0 6px 0 30px}
.jday-scroll{overflow-y:auto;padding-top:4px}
.jpage.incal{grid-template-columns:minmax(0,3fr) minmax(240px,2fr);max-width:none;padding:0 8px 40px;gap:16px}
.jpage.incal aside{position:sticky;top:0}
.jpage.incal .jnote{min-height:260px}
@media (max-width:1180px){ .jpage.incal{grid-template-columns:minmax(0,1fr)} .jpage.incal aside{position:static} }
.cbtn{opacity:0;cursor:pointer;color:var(--muted);flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border-radius:6px;line-height:0;margin-left:auto}
.cbtn svg{width:13px;height:13px}
.cbtn + .subplus{margin-left:2px}
.trow:hover .cbtn,.evrow:hover .cbtn,.cbtn:focus-visible{opacity:1}
.cbtn:hover{opacity:1!important;color:var(--fg);background:var(--hover, rgba(0,0,0,.05))}
@media (hover:none){.cbtn{opacity:.55}}
.plog{margin:-2px 0 6px 34px;display:flex;flex-direction:column;gap:1px}
.plog-i{display:flex;gap:7px;border:0;background:none;font:inherit;font-size:13px;color:var(--fg2);text-align:left;padding:2px 4px;border-radius:6px;cursor:pointer;line-height:1.45}
.plog-i:hover{background:var(--hover, rgba(0,0,0,.04))}
.plog .ccomp{margin-top:4px}
.jadd-row{margin:0 8px 14px;max-width:none}
.jadd-row .addline{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 12px}
.jadd-row .addline input{flex:1;min-width:0}
.jadd-seg{flex:none;margin-left:auto}

.jw{max-width:1100px;padding:0 8px 60px}
.jw-cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,2fr);gap:16px;font-size:12.5px;font-weight:700;color:var(--muted);padding:0 6px 6px}
.jw-day{border-top:1px solid var(--line);padding:10px 0 6px}
.jw-day.empty{padding:4px 0}
.jw-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font:inherit;color:var(--fg);padding:6px 6px;border-radius:10px;cursor:pointer;text-align:left}
.jw-h b{font-size:16px}
.jw-h:hover{background:var(--hover, rgba(0,0,0,.035))}
.jw-day.sel .jw-h b{color:var(--lemon-ink)}
.jw-day.empty .jw-h b{color:var(--muted);font-weight:700}
.jw .jpage.incal{padding:4px 0 6px;max-width:none}
.jw .jpage.incal aside{position:static}
.jw .jpage.incal .jnote{min-height:64px}
.jw .jgroup{margin-bottom:8px}
@media (max-width:1180px){ .jw-cols{display:none} }
.jday-scroll{display:flex;flex-direction:column}
#jl-res{flex:1;display:flex;flex-direction:column}
.jg{display:grid;flex:1;border-top:1px solid var(--line)}
.jg-col{display:flex;flex-direction:column;border-right:1px solid var(--line-soft);min-width:0;padding:6px 6px 10px}
.jg-col:last-child{border-right:0}
.jg-h{display:flex;align-items:center;gap:6px;padding:2px 4px 8px}
.jg-h b{font-size:16px}
.jg-h b.today{background:var(--lemon);color:var(--on-lemon);border-radius:999px;padding:1px 8px}
.jg-h span{font-size:12.5px;color:var(--muted)}
.jg-add{position:static;opacity:.5}
.jg-col:hover .jg-add{opacity:1}
.jg-items{display:flex;flex-direction:column;gap:2px;flex:1}
.jg-it{padding:3px 2px;border-radius:8px}
.jg-r{display:flex;align-items:flex-start;gap:6px}
.jg-r .chk{width:16px;height:16px;margin-top:2px;flex:none}
.jg-dot{width:8px;height:8px;border-radius:4px;margin:7px 4px 0;flex:none}
.jg-t{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);text-align:left;padding:0;cursor:pointer;line-height:1.45;word-break:break-word}
.jg-t .tm{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.jg-it.done .jg-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.jg-it:hover .cbtn{opacity:.75}
.jg .plog{margin:2px 0 2px 22px}
.jg .plog-i{font-size:12.5px;padding:1px 2px}
.jg .plog-i .ilog-t{min-width:0}
.jg .ccomp{flex-direction:column;align-items:stretch;padding:4px 6px}
.jg-empty{color:var(--faint);padding:2px 6px}
.jg-memo{margin-top:10px;padding:6px 6px 2px;border-radius:10px;background:var(--surface);box-shadow:var(--nm-in-sm, inset 0 0 0 1px var(--line))}
.jg-ml{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.jg-memo .ed{font-size:13.5px;padding-left:16px}
.jg-memo .ed-tail{min-height:6px}
.jg-memo .ed .bk-text:empty::before,.jg-memo .ed.ed-empty .bk-text:empty::before{content:'적기'}
.jg .plog-i{flex-direction:column;gap:0}
.jg .plog-i .ilog-t{font-size:11px}
.jg-open{display:flex;align-items:center;gap:6px;border:0;background:none;font:inherit;color:var(--fg);padding:2px 6px;margin:-2px -6px;border-radius:9px;cursor:pointer}
.jg-open:hover{background:var(--hover, rgba(0,0,0,.05))}
.jg-go{border:0;background:none;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:7px}
.jg-go:hover{color:var(--fg);background:var(--hover, rgba(0,0,0,.05))}
.jg{transition:grid-template-columns .18s ease}
.jg{padding:6px 4px 8px;gap:0}
.jg-col{border-radius:14px;transition:background .15s, box-shadow .15s}
.jg-col.sel{background:var(--surface);box-shadow:var(--nm-out-sm, 0 2px 10px rgba(40,50,70,.08));border-right-color:transparent;z-index:1}
.jg-col:has(+ .jg-col.sel){border-right-color:transparent}
.jg-col.sel .jg-memo{background:var(--bg)}
.jg-col.today:not(.sel){background:color-mix(in srgb, var(--lemon-soft) 30%, transparent)}
.jg-col.sel .jg-h b:not(.today){color:var(--lemon-ink)}
.jg-col:not(.sel) .jg-open{cursor:pointer}
.jg-col:not(.sel):hover{background:var(--hover, rgba(0,0,0,.025))}
.jd-back{margin:2px 0 10px 4px;align-self:flex-start}
.ed.all .bk{background:color-mix(in srgb, var(--lemon) 28%, transparent);border-radius:4px}
.ed.all .bk-text{caret-color:transparent}
.jsearch{display:flex;width:150px;margin-right:2px}
.jsearch input{flex:1;min-width:0}
.jday-scroll .jls{padding-top:6px}
.jg-in{display:flex;align-items:center;gap:5px;margin-top:4px;padding:3px 6px;border-radius:8px;color:var(--faint)}
.jg-in svg{width:12px;height:12px;flex:none}
.jg-in input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;color:var(--fg);outline:none;padding:2px 0}
.jg-in input::placeholder{color:var(--faint)}
.jg-in:focus-within{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--lemon);color:var(--muted)}
.jg-it .cbtn{opacity:.35}
.chk.ev{border-color:var(--chip, var(--blue))}
.chk.ev.on{background:var(--chip, var(--blue));border-color:var(--chip, var(--blue))}
.jg-it .subplus,.jrow .subplus{opacity:0;flex:none}
.jg-it:hover .subplus,.jrow:hover .subplus{opacity:.6}
.jg .sub-inline{margin-left:22px}
.jpar{display:block;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.3;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsub{color:var(--faint);margin-right:4px;font-weight:600}
.jrow .jpar{display:inline;margin-right:6px;font-size:12px}
.jg-r{position:relative}
.jg-r .cbtn,.jg-r .subplus{position:absolute;top:0;display:none;width:22px;height:22px;padding:0;margin:0;background:var(--surface);box-shadow:0 1px 4px rgba(40,50,70,.12);border-radius:7px;opacity:1!important}
.jg-r .cbtn{right:26px}.jg-r .subplus{right:0}
.jg-it:hover > .jg-r .cbtn,.jg-it:hover > .jg-r .subplus{display:inline-flex}
@media (hover:none){ .jg-r .cbtn,.jg-r .subplus{display:none!important} }
.jnote-tabs{display:flex;gap:4px}
.jnote-tabs button{border:0;background:none;font:inherit;font-size:inherit;font-weight:700;color:var(--muted);padding:2px 8px;border-radius:8px;cursor:pointer}
.jnote-tabs button.on{color:var(--fg);background:var(--surface);box-shadow:var(--nm-out-xs, 0 1px 3px rgba(0,0,0,.08))}
.jnote-tabs .muted{font-size:10.5px;font-weight:700;margin-left:2px}
.jnote.diary{background:color-mix(in srgb, var(--rose-soft) 45%, var(--surface))}
.jg-in{position:relative;flex-wrap:wrap}
.jg-kind{display:none;width:100%;gap:2px;margin-top:4px}
.jg-in:focus-within .jg-kind{display:flex}
.jg-kind button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);padding:3px 0;border-radius:6px;cursor:pointer}
.jg-kind button.on{background:var(--lemon-soft);color:var(--lemon-ink)}
.jrow .cbtn{opacity:0}
.jrow:hover .cbtn{opacity:.6}
.jrow .cbtn:hover{opacity:1}
.jrow{padding:2px 0 4px}
/* ---- 강조 색 (설정 → 디자인) ---- */
html[data-accent="peach"]{--lemon:#FFB38A!important;--lemon-soft:#FFE8DA!important;--lemon-ink:#8A3B12!important;--on-lemon:#2A1205!important;--sel:#FFF5EE!important;--lemon-strong:#F08A4B!important}
html[data-accent="rose"]{--lemon:#F7A1B5!important;--lemon-soft:#FFE4EB!important;--lemon-ink:#8C2643!important;--on-lemon:#2B0A13!important;--sel:#FFF4F7!important;--lemon-strong:#E0607E!important}
html[data-accent="sky"]{--lemon:#8CC4F5!important;--lemon-soft:#E2F0FD!important;--lemon-ink:#1F5F99!important;--on-lemon:#071C30!important;--sel:#F2F8FE!important;--lemon-strong:#4A9BE0!important}
html[data-accent="lavender"]{--lemon:#BBA6F2!important;--lemon-soft:#EEE8FD!important;--lemon-ink:#4B3496!important;--on-lemon:#160C33!important;--sel:#F7F4FE!important;--lemon-strong:#8B6FE0!important}
html[data-accent="mint"]{--lemon:#93D9C3!important;--lemon-soft:#E0F5EE!important;--lemon-ink:#1E6B55!important;--on-lemon:#06231A!important;--sel:#F1FBF7!important;--lemon-strong:#3FB58F!important}
@media (prefers-color-scheme: dark){ html[data-accent="peach"]:not([data-theme="light"]),html[data-accent="rose"]:not([data-theme="light"]),html[data-accent="sky"]:not([data-theme="light"]),html[data-accent="lavender"]:not([data-theme="light"]),html[data-accent="mint"]:not([data-theme="light"]){--lemon-soft:color-mix(in srgb, var(--lemon) 22%, #1C1C1F)!important;--lemon-ink:color-mix(in srgb, var(--lemon) 75%, #fff)!important;--sel:color-mix(in srgb, var(--lemon) 10%, #1C1C1F)!important;--on-lemon:#1A1A1C!important} }
html[data-accent="peach"][data-theme="dark"],html[data-accent="rose"][data-theme="dark"],html[data-accent="sky"][data-theme="dark"],html[data-accent="lavender"][data-theme="dark"],html[data-accent="mint"][data-theme="dark"]{--lemon-soft:color-mix(in srgb, var(--lemon) 22%, #1C1C1F)!important;--lemon-ink:color-mix(in srgb, var(--lemon) 75%, #fff)!important;--sel:color-mix(in srgb, var(--lemon) 10%, #1C1C1F)!important;--on-lemon:#1A1A1C!important}
.accents{display:flex;gap:8px;flex-wrap:wrap}
.acc{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--a);box-shadow:var(--nm-out-xs, 0 1px 3px rgba(0,0,0,.15));position:relative}
.acc.on::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--a)}
.cat-tg{display:flex;align-items:center;gap:4px;border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.cat-tg svg{width:12px;height:12px}
.cat-tg .cnt{margin-left:4px;font-weight:600;opacity:.7}
.jg-rt{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.jg-rti{display:flex;align-items:flex-start;gap:5px;border:0;background:color-mix(in srgb, var(--rose-soft) 70%, transparent);border-radius:8px;padding:4px 6px;font:inherit;font-size:12.5px;color:var(--fg);text-align:left;cursor:pointer;line-height:1.4}
.jg-rti .xk{flex:none;font-size:10.5px;padding:1px 5px}
/* 일지: 코멘트와 하위 할일을 구분해서 보이게 */
.jg .plog{margin:3px 0 4px 22px;padding:3px 0 3px 8px;border-left:2px solid color-mix(in srgb, var(--lemon) 70%, transparent);gap:3px}
.jg .plog-i{flex-direction:row;align-items:baseline;gap:5px;font-size:12px;color:var(--fg2);background:none;padding:0 2px;line-height:1.45}
.jg .plog-i .ilog-t{flex:none;font-size:10.5px;font-weight:700;color:var(--lemon-ink);background:var(--lemon-soft);border-radius:4px;padding:0 4px;min-width:0}
.jg-it[style*="margin-left"] .jg-t{font-weight:500;font-size:13px;color:var(--fg2)}
.jg-it[style*="margin-left"]{border-left:1px dashed var(--line);padding-left:6px}
.jg .jsub{display:none}
.jlog{border-left:2px solid color-mix(in srgb, var(--lemon) 70%, transparent);margin-left:30px;padding-left:10px}
.jlog .ilog-t{font-size:11px;font-weight:700;color:var(--lemon-ink)}
.plog-i.rich{cursor:default;align-items:flex-start}
.plog-i.rich .ed{font-size:12.5px;padding-left:14px;line-height:1.5}
.plog-i.rich .ed-tail{min-height:0}
.jg .plog-i.rich{flex-direction:column;gap:1px}
.jg-ghost,.j-ghost{display:flex;align-items:baseline;gap:6px;width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer;padding:2px 4px;border-radius:7px;color:var(--muted)}
.jg-ghost:hover,.j-ghost:hover{background:var(--hover, rgba(0,0,0,.04))}
.jg-ghost .gh-t,.j-ghost .gh-t{font-size:12.5px;font-weight:700;min-width:0;word-break:break-word}
.jg-ghost{align-items:flex-start;flex-wrap:wrap}
.jg-ghost .gh-t::before,.j-ghost .gh-t::before{content:'';display:inline-block;width:9px;height:9px;border:1.5px dashed var(--faint);border-radius:3px;margin-right:6px;vertical-align:-1px}
.gh-d{flex:none;font-size:11px;color:var(--faint)}
.jrow.ghost{padding:4px 0 0;border-bottom:0}
.jrow.ghost + .jrow{border-top:0}
.j-ghost .gh-t{font-size:13.5px}
.rfq{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--lemon-ink);background:var(--lemon-soft);border-radius:5px;padding:1px 5px;vertical-align:1px;white-space:nowrap}
.atag{background:color-mix(in srgb, var(--ac) 22%, transparent)!important;color:var(--fg2)!important;gap:4px!important;font-weight:600!important;border-radius:999px!important;padding:2px 7px 2px 5px!important}
.atag i{width:6px;height:6px;border-radius:50%;background:var(--ac);flex:none}
.atag b{display:none}
.chip .atag{padding:1px 4px!important;background:none!important;font-size:0!important;margin-right:2px!important}
.chip .atag i{width:7px;height:7px}
.adot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none;margin:0 3px 0 2px}
.adot.big{width:14px;height:14px;margin-right:10px}
.acols{display:flex;gap:5px;margin-right:10px}
.acol{width:18px;height:18px;border-radius:50%;border:0;background:var(--ac);cursor:pointer;opacity:.75}
.acol.on{opacity:1;box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--ac)}
/* 상위 할일: 코드 블록처럼 작은 상자로 */
.jg-ghost,.j-ghost{display:inline-flex;width:auto;max-width:100%;background:rgba(135,131,120,.13);border-radius:6px;padding:2px 7px;margin:2px 0 1px;color:var(--fg2)}
.jg-ghost .gh-t::before,.j-ghost .gh-t::before{display:none}
.jg-ghost .gh-t,.j-ghost .gh-t{font-weight:600;font-size:12px}
.j-ghost .gh-t{font-size:13px}
.jg-ghost:hover,.j-ghost:hover{background:rgba(135,131,120,.22)}
.pchip{display:inline-block;max-width:100%;background:rgba(135,131,120,.14);color:var(--fg2);border-radius:5px;padding:1px 6px;font-size:11.5px;font-weight:600;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.pc-line{display:block;margin-top:2px;font-weight:400}
.chip-pc{flex:1 0 100%;order:8;padding:0 2px 1px 20px;min-width:0;overflow:hidden}
.chip.has-ck .chip-ck{padding-left:20px}
.chip-pc .pchip{font-size:10.5px;padding:0 5px}
.ptl.show{margin-top:2px}
.ptl .pchip{font-size:11.5px}
/* 테마(강조) 색을 따라가는 코드 상자 */
.pchip{background:var(--lemon-soft)!important;color:var(--lemon-ink)!important}

/* ===================== Soft (neumorphic) theme =====================
   One background colour for every surface; depth comes from paired light/dark shadows.
   Raised = things you press or that hold a group. Pressed-in = inputs, chosen tabs, the active nav row.
   Lemon is the only accent. */
:root{
  --bg:#F3F5F9; --side:#F3F5F9; --panel:#F3F5F9; --surface:#F3F5F9; --sunken:#ECEFF4; --hover:#EDF0F5; --dim:#F0F2F6; --sel:#F8F6E8;
  --line:rgba(150,163,184,.32); --line-soft:rgba(150,163,184,.2);
  --fg:#1C2029; --fg2:#383E4A; --muted:#575E6C; --faint:#868E9C;
  --lemon:#FFDA45; --lemon-soft:#FFF3BF; --lemon-ink:#6A5200; --on-lemon:#2A2400;
  --ink-btn:#262A33; --ink-btn-fg:#FFFFFF;
  --hi:#FFFFFF; --lo:rgba(170,182,203,.5); --lo2:rgba(170,182,203,.3);
  --nm-out:-6px -6px 14px var(--hi), 6px 6px 14px var(--lo);
  --nm-out-sm:-3px -3px 7px var(--hi), 3px 3px 7px var(--lo);
  --nm-out-xs:-2px -2px 4px var(--hi), 2px 2px 4px var(--lo2);
  --nm-in:inset 3px 3px 7px var(--lo), inset -3px -3px 7px var(--hi);
  --nm-in-sm:inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);
  --shadow:var(--nm-out-xs); --shadow-md:var(--nm-out-sm); --shadow-lg:-10px -10px 30px rgba(255,255,255,.7), 14px 18px 40px rgba(120,134,158,.45);
  --scrim:rgba(225,230,238,.5);
  --r-lg:22px; --r-md:16px; --r-sm:12px; --we:transparent;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#23262D; --side:#23262D; --panel:#23262D; --surface:#23262D; --sunken:#1E2127; --hover:#282C34; --dim:#21242A; --sel:#2A2A24;
  --line:rgba(0,0,0,.28); --line-soft:rgba(0,0,0,.2);
  --fg:#F1F3F6; --fg2:#D3D7DE; --muted:#A8AEBA; --faint:#7A8190;
  --lemon:#E8CB45; --lemon-soft:#3A3519; --lemon-ink:#F3DF8A; --on-lemon:#231F05;
  --ink-btn:#ECEEF2; --ink-btn-fg:#23262D;
  --hi:rgba(255,255,255,.055); --lo:rgba(0,0,0,.5); --lo2:rgba(0,0,0,.38);
  --shadow-lg:-8px -8px 24px rgba(255,255,255,.04), 14px 18px 40px rgba(0,0,0,.6);
  --scrim:rgba(10,12,16,.55); --we:transparent;
} }
:root[data-theme="dark"]{ --we:transparent; }
.cell.we:not(.other):not(.selday){background:transparent}

/* ---- shell ---- */
body,.app,.main,.side,.panel,.topbar{background:var(--bg)}
.side{border-right:0}
.panel{border-left:0}
.topbar{border-bottom:0}
.side-foot{border-top:0}

/* ---- buttons ---- */
.btn{border:0;border-radius:var(--r-sm);background:var(--bg);box-shadow:var(--nm-out-sm);font-weight:600;color:var(--fg2);transition:box-shadow .15s, transform .1s, color .15s}
.btn:hover{color:var(--fg)}
.btn:active,.btn.on,.btn.on-soft{box-shadow:var(--nm-in-sm);transform:none}
.btn.on-soft{background:var(--bg);color:var(--lemon-ink)}
.btn.primary{background:var(--lemon);color:var(--on-lemon);box-shadow:-4px -4px 10px var(--hi), 4px 5px 12px color-mix(in srgb, var(--lemon-strong) 38%, transparent)}
.btn.primary:active{box-shadow:inset 3px 3px 6px rgba(150,120,10,.35), inset -2px -2px 5px rgba(255,255,255,.5)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.ghost:hover{box-shadow:var(--nm-out-xs)}

/* ---------- LIFE ---------- */
function dayRecords(d) {
  const out = [];
  S.posts.filter(p => p.date === d).forEach(p => out.push({ t: 'post', o: p }));
  S.citems.forEach(ci => { const c = coll(ci.coll); if (!c) return; c.fields.forEach(f => { if (f.type === 'date' && f.onCal && ci.values[f.id] === d) out.push({ t: 'citem', o: ci, c, f }); }); });
  S.citems.forEach(ci => { const c = coll(ci.coll); if (!c) return; const ss = (ci.sessions || []).filter(x => x.date === d); if (!ss.length || out.some(r => r.o === ci)) return; out.push({ t: 'citem', o: ci, c, f: { name: (collSource(c) === 'book' ? '읽음' : '봄') + (ss[ss.length - 1].upto ? ' · ' + ss[ss.length - 1].upto : '') } }); });
  return out;
}
function dayCover(recs) {

  if (p) return p.o.cover;

  return c ? { img: c.o.img, tone: c.o.tone } : null;
}

const postTitle = p => p.title || dayLabel(p.date);

    const cr = caretRect(); const er = el.getBoundingClientRect(); const lh = parseFloat(getComputedStyle(el).lineHeight) || 22;
    const edge = !cr ? true : down ? cr.bottom > er.bottom - lh * 0.75 : cr.top < er.top + lh * 0.75;
    if (!edge) return;
    e.preventDefault(); placeAtX(next, cr ? cr.left : er.left, down);
  }
}

/* drag & drop */
let dragId = null, dragKind = null, hiEl = null, hiPos = '';
function setHi(el, pos = '') {
  if (hiEl === el && hiPos === pos) return;
  if (hiEl) hiEl.classList.remove('drop-hi', 'drop-before', 'drop-after');
  hiEl = el; hiPos = pos;
  if (el) el.classList.add(pos === 'before' ? 'drop-before' : pos === 'after' ? 'drop-after' : 'drop-hi');
}
function folderZone(z, e) { const r = z.getBoundingClientRect(); const y = (e.clientY - r.top) / r.height; return y < 0.28 ? 'before' : y > 0.72 ? 'after' : 'into'; }
function isInside(childId, parentId) { let f = folder(childId); while (f) { if (f.parent === parentId) return true; f = f.parent ? folder(f.parent) : null; } return false; }
function canDrop(kind, zk, zv) {
  if (kind === 'item') return ['day', 'inbox', 'project'].includes(zk);
  if (zk === 'froot') { if (kind === 'doc') return zv === 'work' && !!(doc(dragId) || {}).folder; const f = kind === 'folder' && folder(dragId); return !!f && f.space === zv; }
  if (zk !== 'folder') return false;
  const target = folder(zv); if (!target) return false;
  if (kind === 'folder') { const f = folder(dragId); return !!f && f.id !== zv && f.space === target.space && !isInside(zv, f.id); }
  if (kind === 'doc') return target.space === 'work';
  if (kind === 'post') return target.space === 'life';
  return false;
}
function moveFolder(id, targetId, pos) {
  const f = folder(id), t = targetId && folder(targetId);
  const parent = pos === 'into' ? targetId : pos === 'root' ? null : t.parent;
  const sibs = S.folders.filter(x => x.space === f.space && x.parent === parent && x.id !== id);
  let at = sibs.length;
  if (pos === 'before' || pos === 'after') at = sibs.findIndex(x => x.id === targetId) + (pos === 'after' ? 1 : 0);
  sibs.splice(at, 0, f);
  f.parent = parent;
  sibs.forEach((x, i) => { x.ord = i; });
  S.folders.sort((a, b) => (a.ord || 0) - (b.ord || 0));
  if (pos === 'into') ui.open[targetId] = true;
}
document.addEventListener('dragstart', e => {
  if (rs) { e.preventDefault(); return; }
  const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return;
  [dragKind, dragId] = el.dataset.drag.split(':');
  e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* ignore */ }
  el.classList.add('dragging');
});
document.addEventListener('dragend', e => { const el = e.target.closest && e.target.closest('[data-drag]'); if (el) el.classList.remove('dragging'); dragId = null; dragKind = null; setHi(null); });
document.addEventListener('dragover', e => {
  if (!dragId) return; const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) { setHi(null); return; }
  const [k, v] = z.dataset.drop.split(':');
  if (!canDrop(dragKind, k, v)) { setHi(null); return; }
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  if (k === 'folder') { setHi(z, dragKind === 'folder' ? folderZone(z, e) : 'into'); return; }
  setHi(k === 'day' ? document.querySelector(`.cell[data-date="${v}"]`) : z);
});
document.addEventListener('drop', e => {
  if (!dragId) return; const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return;
  const [k, v] = z.dataset.drop.split(':');
  if (!canDrop(dragKind, k, v)) return;
  e.preventDefault(); const id = dragId, kind = dragKind; const pos = k === 'folder' && kind === 'folder' ? folderZone(z, e) : 'into';
  dragId = null; dragKind = null; setHi(null);
  if (kind === 'folder') {
    const f = folder(id); const t = k === 'folder' ? folder(v) : null;
    mutate(() => moveFolder(id, t ? t.id : null, k === 'froot' ? 'root' : pos), k === 'froot' ? `‘${f.name}’을 맨 위 단계로 옮겼어요` : pos === 'into' ? `‘${f.name}’을 ‘${t.name}’ 안에 넣었어요` : '폴더 순서를 바꿨어요');
    return;
  }
  if (kind === 'doc' && k === 'froot') { const o = doc(id); if (!o) return; mutate(() => { o.folder = null; o.updated = Date.now(); if (ui.noteDoc === id) ui.noteFolder = null; }, `‘${o.title || '제목 없음'}’을 폴더 밖으로 꺼냈어요`); return; }
  if (kind === 'doc' || kind === 'post') {
    const o = kind === 'doc' ? doc(id) : post(id); const t = folder(v); if (!o || !t || o.folder === v) return;
    mutate(() => { o.folder = v; if (kind === 'doc') { o.updated = Date.now(); if (ui.noteDoc === id) ui.noteFolder = v; } }, `‘${o.title || '제목 없음'}’을 ‘${t.name}’로 옮겼어요`);
    return;
  }
  const it = item(id); if (!it) return;
  if (k === 'day') {
    if (it.date === v) return;
    mutate(() => { if (it.kind === 'event' && it.end) { const len = diff(it.date, it.end); it.end = addDays(v, len); } it.date = v; ui.sel = v; }, `‘${it.title}’을 ${fmtMD(v)}로 옮겼어요`);
  } else if (k === 'inbox') {
    if (it.kind !== 'todo') { toast('일정은 날짜가 꼭 필요해요'); return; }
    if (!it.date) return;
    mutate(() => { it.date = null; }, '날짜 없는 할일로 옮겼어요');
  } else if (k === 'project') {
    const p = proj(v); if (it.projectId === v) { toast(`이미 ‘${p.title}’에 들어 있어요`); return; }
    mutate(() => { it.projectId = v; }, `‘${p.title}’ 프로젝트에 넣었어요`);
  }
});

/* pane widths: drag the edges of the sidebar and the right panel */
const PANE = { side: { v: '--side-w', def: 252, min: 200, max: 420 }, panel: { v: '--panel-w', def: 360, min: 290, max: 640 } };
function setPane(k, w, keep) {
  const c = PANE[k]; w = Math.round(Math.max(c.min, Math.min(c.max, w)));
  document.documentElement.style.setProperty(c.v, w + 'px');
  if (keep) { try { localStorage.setItem('arecmik-pane-' + k, String(w)); } catch (e) { /* storage blocked */ } }
}
Object.keys(PANE).forEach(k => { try { const w = +localStorage.getItem('arecmik-pane-' + k); if (w) setPane(k, w); } catch (e) { /* storage blocked */ } });
let paneDrag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-rz]'); if (!h || e.button !== 0) return;
  e.preventDefault(); paneDrag = h.dataset.rz; h.classList.add('on'); document.body.classList.add('resizing');
});
document.addEventListener('pointermove', e => {
  if (!paneDrag) return;
  setPane(paneDrag, paneDrag === 'side' ? e.clientX : window.innerWidth - e.clientX);
});
document.addEventListener('pointerup', () => {
  if (!paneDrag) return; const k = paneDrag; paneDrag = null; document.body.classList.remove('resizing');
  document.querySelectorAll('.rz.on').forEach(x => x.classList.remove('on'));
  setPane(k, parseInt(getComputedStyle(document.documentElement).getPropertyValue(PANE[k].v)) || PANE[k].def, true);
});
document.addEventListener('dblclick', e => { const h = e.target.closest && e.target.closest('[data-rz]'); if (!h) return; const k = h.dataset.rz; setPane(k, PANE[k].def, true); toast('원래 너비로 돌아갔어요'); });
document.addEventListener('keydown', e => {
  const h = e.target.closest && e.target.closest('[data-rz]'); if (!h || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault(); const k = h.dataset.rz; const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue(PANE[k].v)) || PANE[k].def;
  const d = (e.key === 'ArrowRight' ? 16 : -16) * (k === 'side' ? 1 : -1); setPane(k, cur + d, true);
});
/* resize bars */
let rs = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-resize]'); if (!h || e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const [k, id] = h.dataset.resize.split(':'); snapshot(); rs = { k, id, moved: false };
  document.body.classList.add('resizing');
});
document.addEventListener('pointermove', e => {
  if (!rs) return;
  const el = document.elementFromPoint(e.clientX, e.clientY); const c = el && el.closest('[data-date]'); if (!c) return;
  const d = c.dataset.date;
  if (rs.k === 'event') { const it = item(rs.id); const nd = d <= it.date ? null : d; if (nd !== it.end) { it.end = nd; rs.moved = true; render(); } }
  else { const p = proj(rs.id); const nd = d < p.start ? p.start : d; if (nd !== p.end) { p.end = nd; rs.moved = true; render(); } }
});
document.addEventListener('pointerup', () => {
  if (!rs) return; document.body.classList.remove('resizing');
  const r = rs; rs = null;
  if (!r.moved) { hist.pop(); return; }
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
  save();
  if (r.k === 'event') { const it = item(r.id); toast(it.end ? `${fmtShort(it.date)}–${fmtShort(it.end)} 기간 일정이 됐어요` : '하루 일정이 됐어요', true); }
  else { const p = proj(r.id); toast(`끝 날짜를 ${fmtMD(p.end)}로 바꿨어요`, true); }
});
window.addEventListener('resize', () => { if (slash) drawSlash(); if (ui.search) drawSearch(); });

boot();
})();
</script>
