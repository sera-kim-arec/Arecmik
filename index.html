<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arecmik</title><meta name="application-version" content="2026.10.16.5"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#E9E9E9">
<style>
:root{--tx:#0E0E0E;--t2:#3F3F3F;--mu:#858585;--ln:rgba(0,0,0,.07);--ink:linear-gradient(180deg,#474747,#111 55%,#000)}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--tx);min-height:100vh;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;letter-spacing:-.01em;
background:radial-gradient(420px 420px at 8% 12%,#9E9E9E,transparent 70%),radial-gradient(520px 520px at 94% 24%,#858585,transparent 70%),radial-gradient(480px 480px at 40% 100%,#A8A8A8,transparent 70%),radial-gradient(320px 320px at 70% 66%,#fff,transparent 70%),linear-gradient(160deg,#F2F2F2,#D2D2D2);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid #111;outline-offset:2px}
.g{position:relative;border-radius:24px;background:linear-gradient(125deg,rgba(255,255,255,.62),rgba(255,255,255,.22) 40%,rgba(255,255,255,.16) 70%,rgba(255,255,255,.34));
 backdrop-filter:blur(30px) saturate(160%) brightness(1.06);-webkit-backdrop-filter:blur(30px) saturate(160%) brightness(1.06);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset 2px 2px 1px -1px rgba(255,255,255,.95),inset -2px -2px 2px -1px rgba(0,0,0,.1),0 26px 50px -22px rgba(0,0,0,.32)}
.solid{background:rgba(250,250,250,.96)!important}
.ink{border:0;font-weight:800;color:#fff;border-radius:999px;padding:10px 18px;background:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -6px rgba(0,0,0,.5);white-space:nowrap}
.soft{border:0;font-weight:700;border-radius:999px;padding:8px 14px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:inset 1px 1px 0 #fff,0 4px 10px -4px rgba(0,0,0,.22);white-space:nowrap}
.link{border:0;background:none;padding:0;font-weight:700;color:var(--mu);font-size:12.5px}
.link:hover{color:var(--tx)}
.well{background:rgba(255,255,255,.32);box-shadow:inset 1px 2px 4px rgba(0,0,0,.1),inset -1px -1px 0 rgba(255,255,255,.8);border:0;outline:0}
h2.ct{margin:0 0 10px;font-size:12.5px;font-weight:800;color:#555;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2.ct small{font-weight:700;color:var(--mu)}
.box{padding:18px 20px}
.emp{color:var(--mu);font-size:13px;padding:6px 0}

/* 상단 */
.top{position:relative;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px 8px;max-width:1280px;margin:0 auto}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;width:max-content}
.seg button{border:0;background:none;font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;color:#666;white-space:nowrap}
.sp button.on{color:#fff;background:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -6px rgba(0,0,0,.5)}
.nav button.on{color:#000;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(255,255,255,.6));box-shadow:inset 1px 1px 0 #fff,0 4px 12px -3px rgba(0,0,0,.25)}
.nav button{padding:9px 18px;font-size:13.5px}
.tr{justify-self:end;display:flex;gap:8px}
.ic{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.45));box-shadow:inset 1px 1px 0 #fff,0 4px 10px -4px rgba(0,0,0,.25);font-size:16px}
main{max-width:1280px;margin:0 auto;padding:8px 20px 60px}

/* 입력 */
.qbar{display:flex;align-items:center;gap:8px;padding:7px 7px 7px 20px;border-radius:999px}
.qbar input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15.5px}
.qbar input::placeholder{color:#777}
.qbar .tag{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:#111;color:#fff;white-space:nowrap}
.cam{width:38px;height:38px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.4));box-shadow:inset 1px 1px 0 #fff,0 3px 8px -3px rgba(0,0,0,.25)}
.cam::before{content:'';width:14px;height:11px;border:1.8px solid #333;border-radius:3px}
.cam.on{background:#111}.cam.on::before{border-color:#fff}
.pv{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;margin:8px 8px 0}
.pv span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.6);color:#333}
.pv span.k{background:#111;color:#fff}
.pv .h{background:none;color:#777;font-weight:600;padding-left:2px}
.att{display:flex;gap:6px;margin:8px 8px 0}
.att span{position:relative}.att img{width:56px;height:42px;object-fit:cover;border-radius:10px;display:block}
.att button{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#111;color:#fff;font-size:12px;line-height:1}

/* 항목 */
.it{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13.5px;line-height:1.4}
.ck{width:17px;height:17px;border-radius:50%;flex:none;margin-top:1px;border:0;padding:0;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.4));box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 1px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.18)}
.dn .ck{background:radial-gradient(circle at 35% 30%,#555,#0A0A0A 70%);box-shadow:0 2px 4px rgba(0,0,0,.3);position:relative}
.dn .ck::after{content:'';position:absolute;left:6px;top:3px;width:4px;height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.it .tt{flex:1;min-width:0;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
.dn .tt{color:#999;text-decoration:line-through}
.it.ev .tt{font-weight:700}
.it em{font-style:normal;font-weight:800;font-size:11.5px;margin-right:4px}
.tg{display:inline-block;font-size:10.5px;font-weight:800;color:#555;background:rgba(0,0,0,.06);padding:1px 7px;border-radius:999px;margin-left:5px;vertical-align:1px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.it .nt{display:block;font-size:12px;color:#666;text-decoration:none;font-weight:400;margin-top:1px}
.it .late{font-size:10.5px;font-weight:800;color:#9A4A42;margin-left:5px}
.evd{width:17px;flex:none}

/* 오늘 */
.hhead{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.hhead h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.05em;white-space:nowrap}
.hhead h1 small{font-size:14px;font-weight:700;color:#555;margin-left:8px;letter-spacing:-.01em}
.qwrap{flex:1;min-width:0}
.hg{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.d{border-radius:18px;padding:10px 10px 12px;min-height:170px;background:rgba(255,255,255,.22);box-shadow:inset 1px 2px 3px rgba(0,0,0,.06),inset -1px -1px 0 rgba(255,255,255,.7);min-width:0}
.d.td{background:rgba(255,255,255,.8);box-shadow:inset 1px 1px 0 #fff,0 12px 26px -12px rgba(0,0,0,.35)}
.d .dh{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.d .dh b{font-size:22px;font-weight:300;letter-spacing:-.04em}
.d.td .dh b{font-weight:800}
.d .dh span{font-size:12px;font-weight:700;color:var(--mu)}
.d.td .dh span{color:#111}.d .dh .hol{color:#9A4A42}
.d .dh .pl{margin-left:auto;border:0;background:none;color:#999;font-size:16px;line-height:1;padding:0 2px;opacity:0}
.d:hover .pl{opacity:1}
.d .dy{display:contents}
.und{margin-top:12px;padding-top:10px;border-top:1px solid var(--ln)}
.und h3{margin:0 0 4px;font-size:12px;font-weight:800;color:#777}
.lday{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--ln)}
.lday:first-of-type{border-top:0}
.lday .dd{font-size:12.5px;font-weight:700;color:#666}.lday .dd b{display:block;font-size:20px;font-weight:300;color:#111;letter-spacing:-.03em;line-height:1.2}
.lday.now .dd b{font-weight:800}
.lday p{margin:0;font-size:14px;line-height:1.7;color:#2b2b2b;white-space:pre-wrap;cursor:text}
.lday p:empty::before{content:'비어 있어요';color:#aaa}
.ta{width:100%;min-height:72px;resize:none;font-size:14.5px;line-height:1.7;padding:12px 14px;border-radius:16px;overflow:hidden}
.ta::placeholder{color:#888}
.lrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pics img{width:132px;height:99px;object-fit:cover;border-radius:14px;display:block;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 18px -10px rgba(0,0,0,.35);cursor:zoom-in}
.pics.sm img{width:92px;height:69px;border-radius:11px}
.pjr{padding:11px 0;border-top:1px solid var(--ln);cursor:pointer}
.pjr:first-of-type{border-top:0}
.pjr .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:800;font-size:14.5px}
.pjr .t small{font-size:12px;color:var(--mu);font-weight:700;white-space:nowrap}
.bar{height:6px;border-radius:999px;background:rgba(0,0,0,.08);margin:8px 0 6px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:999px;background:#111}
.pjr .n{font-size:12.5px;color:var(--t2)}
.fd{position:relative;padding:0 26px 13px 56px;font-size:13.5px}
.fd time{position:absolute;left:0;top:0;font-size:12px;font-weight:800;color:#666;font-variant-numeric:tabular-nums}
.fd::before{content:'';position:absolute;left:43px;top:6px;width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:0 0 0 1.5px #888}
.fd.me::before{background:#111;box-shadow:none}
.fd small{color:var(--mu);font-weight:700;margin-left:5px}
.fd q{display:block;color:#555;font-size:12.5px;quotes:none;margin-top:1px}
.fd .x{position:absolute;right:0;top:-2px;border:0;background:none;color:#aaa;font-size:15px;opacity:0}
.fd:hover .x{opacity:1}

/* 달력 */
.ch{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.ch h1{margin:0 6px;font-size:30px;font-weight:800;letter-spacing:-.05em}
.cg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.mg{padding:14px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mg .w{font-size:12px;font-weight:800;color:#777;padding:2px 8px 4px}
.mc{min-height:100px;border-radius:14px;padding:7px;background:rgba(255,255,255,.2);box-shadow:inset 1px 1px 2px rgba(0,0,0,.05);cursor:pointer;min-width:0;border:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
.mc.o{opacity:.38}.mc.sel{box-shadow:inset 0 0 0 2px #111}
.mc.td{background:rgba(255,255,255,.82);box-shadow:inset 1px 1px 0 #fff,0 10px 22px -12px rgba(0,0,0,.35)}
.mc.td.sel{box-shadow:inset 0 0 0 2px #111,0 10px 22px -12px rgba(0,0,0,.35)}
.mc>b{display:flex;gap:4px;align-items:baseline;font-size:14px;font-weight:400;margin-bottom:3px}.mc.td>b{font-weight:800}
.mc>b small{font-size:10px;color:#9A4A42;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mc.sun>b,.mc.hd>b{color:#9A4A42}
.mc i{display:block;font-style:normal;font-size:11px;line-height:1.35;padding:2px 6px;margin-top:3px;border-radius:6px;background:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc i.e{background:#111;color:#fff;font-weight:700}
.mc i.dn{color:#aaa;text-decoration:line-through}
.mc .more{display:block;font-size:10.5px;color:#777;font-weight:700;margin-top:3px;padding-left:4px}

/* 프로젝트 */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.05em}
.pl2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{padding:18px 20px;cursor:pointer;min-width:0}
.pcard h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.03em;display:flex;justify-content:space-between;gap:8px}
.pcard h3 small{font-size:12.5px;color:var(--mu);font-weight:700;white-space:nowrap}
.pcard .n{font-size:13px;color:var(--t2);margin-top:4px}
.mini{position:relative;height:22px;margin:12px 0 2px}
.mini::before{content:'';position:absolute;left:0;right:0;top:10px;height:2px;border-radius:2px;background:rgba(0,0,0,.1)}
.mini i{position:absolute;top:7px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #777}
.mini i.f{background:#111;box-shadow:none}
.mini b{position:absolute;top:2px;width:2px;height:18px;margin-left:-1px;background:#111;border-radius:1px}
.back{border:0;background:none;font-weight:800;font-size:13.5px;color:#444;padding:4px 0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.meta span,.meta button{font-size:12.5px;font-weight:700;color:#444;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.55);box-shadow:inset 1px 1px 0 #fff;border:0}
.meta b{color:#000}
.pname{font-size:30px;font-weight:800;letter-spacing:-.05em;border:0;background:none;outline:0;padding:0;width:100%;min-width:0}
.per{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.per label{font-size:12px;font-weight:700;color:#555;display:flex;gap:6px;align-items:center}
.per input{border:0;border-radius:10px;padding:6px 8px;background:rgba(255,255,255,.7)}
.pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start;margin-top:18px}
.up .it{padding:9px 0;border-top:1px solid var(--ln);font-size:14.5px}
.up .it:first-of-type{border-top:0}
.up .it .ck{width:19px;height:19px}
.up .when{margin-left:auto;font-size:12.5px;font-weight:800;color:#555;white-space:nowrap}
.mo{font-size:12px;font-weight:800;color:#777;margin:14px 0 8px;display:flex;align-items:center;gap:10px}.mo::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.1)}
.mo:first-child{margin-top:0}
.tlc{padding:16px 0 14px;margin:18px 0 24px}
.tlc h2{padding:0 20px}
.zoom{display:flex;gap:4px}.zoom button{border:0;background:rgba(255,255,255,.4);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;color:#555}.zoom button.on{background:#111;color:#fff}
.tlw{overflow-x:auto;overflow-y:hidden;padding:0 20px 6px;scrollbar-width:thin}
.tl{position:relative}
.tl .ax{position:absolute;left:0;right:0;top:26px;height:2px;background:rgba(0,0,0,.12);border-radius:2px}
.tl .m{position:absolute;top:0;font-size:11.5px;font-weight:800;color:#666;white-space:nowrap;padding-left:5px;border-left:1px solid rgba(0,0,0,.15);height:30px}
.tl .now{position:absolute;top:18px;bottom:0;width:2px;margin-left:-1px;background:#111;border-radius:1px}
.tl .now b{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;background:#111;color:#fff;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tl .fl{position:absolute;top:22px;width:10px;height:10px;margin-left:-5px;border-radius:2px;background:#111;transform:rotate(45deg)}
.tl .ti{z-index:2;position:absolute;display:flex;align-items:center;gap:6px;height:24px;white-space:nowrap;font-size:12px;cursor:pointer}
.tl .ti i{width:10px;height:10px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 1.5px #666}
.tl .ti.f i{background:#111;box-shadow:none}
.tl .ti.e i{border-radius:2px;background:#111;box-shadow:none;transform:rotate(45deg)}
.tl .ti.p i{width:20px;height:20px;border-radius:6px;background-size:cover;background-position:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tl .ti.m2 i{background:#999;box-shadow:none}
.tl .ti span{padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.7);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tl .ti span u{text-decoration:none;color:#777;font-weight:700;margin-right:4px}
.tl .ti.f span{color:#555}
.tl .ti.nl span{display:none}
.tl .lane{position:absolute;left:0;right:0;height:1px;background:rgba(0,0,0,.03)}
.feedin{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 16px;border-radius:999px;margin-bottom:12px}
.feedin input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;color:#777;font-weight:800;text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln)}
.tbl td{padding:4px 4px;border-bottom:1px solid var(--ln)}
.tbl input,.tbl select{width:100%;border:0;background:transparent;padding:6px 4px;border-radius:8px;outline:0;min-width:0}
.tbl input:focus,.tbl select:focus{background:rgba(255,255,255,.8)}
.tbl td.n input{text-align:right}
.tbl tfoot td{font-weight:800;padding:8px}
.tbl .del{border:0;background:none;color:#aaa;font-size:15px}
.tbw{overflow-x:auto}

/* 기록 */
.rh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.rh h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.05em}
.srch{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;margin-bottom:14px}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14.5px;min-width:0}
.rw{max-width:860px;margin:0 auto}
.yrrow{display:flex;align-items:center;gap:14px;margin:0 0 14px;flex-wrap:wrap}
.yr{display:flex;align-items:center;gap:8px}.yr b{font-size:20px;font-weight:800;letter-spacing:-.03em;min-width:52px;text-align:center}
.ar{width:30px;height:30px;border-radius:50%;border:0;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.45));box-shadow:inset 1px 1px 0 #fff,0 3px 8px -3px rgba(0,0,0,.25)}
.ms{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.ms button{border:0;font-size:12px;font-weight:700;color:#555;padding:6px 0 5px;border-radius:10px;background:rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;gap:1px}
.ms button i{font-style:normal;font-size:10px;color:#999;font-weight:700;min-height:14px}
.ms button.on{background:#111;color:#fff}.ms button.on i{color:#bbb}
.ms button:disabled{opacity:.35;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chips button{border:0;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.35);color:#555}
.chips button.on{background:#111;color:#fff}
.dr{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--ln);cursor:pointer}
.dr:first-child{border-top:0}
.dr>div{flex:1;min-width:0}.dr b{display:block;font-size:15px}.dr span{display:block;font-size:13px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr em{font-style:normal;font-size:12.5px;font-weight:700;color:#888;white-space:nowrap}
.dr .fv{border:0;background:none;font-size:16px;color:#bbb;padding:0 2px}.dr .fv.on{color:#111}

.cv-m .dside{position:static!important;height:var(--dsh,auto);max-height:none!important;overflow:auto}
.dcol .rzh{margin:6px 0 0}
@media(max-width:900px){.dcol{position:static}.cv-m .dside{height:auto}.dcol .rzh{display:none}}
/* 비용 날짜 */
.pc-in{display:flex;align-items:center;gap:8px;margin-top:6px}
.pc-in .sp-in{flex:1;min-width:0;margin:0!important}
.pc-day,.pc-dt{position:relative;cursor:pointer}
.pc-day{flex:none;font-size:12.5px;font-weight:700;color:#37352F;background:rgba(55,53,47,.06);padding:7px 11px;border-radius:9px;white-space:nowrap}
.pc-day::before{content:'📅';margin-right:5px;font-size:11px}
.pc-day:hover,.pc-dt:hover{background:rgba(55,53,47,.1)}
.pc-dt{font-size:12px;color:#9b9a97;border-radius:6px;padding:2px 4px;margin:-2px -4px;white-space:nowrap}
.pc-day input,.pc-dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.pc-r{grid-template-columns:46px minmax(0,1fr) auto auto!important}
/* 프로젝트 할 일 바로 적기 */
.pqa{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(55,53,47,.14)}
.pqr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pqr .pqk{margin:0}
.pqa .sp-in{margin:0!important;width:100%}
.pqk button.on{background:#37352F!important;color:#fff}
/* 메모: 할 일별 · 날짜별 */
.es-memo{align-items:flex-start!important}
.es-memo textarea{width:100%;min-height:44px;resize:none;border:0;background:transparent;font:inherit;font-size:14px;color:#37352F;line-height:1.5;padding:2px 0;overflow:hidden}
.es-memo textarea:focus{outline:none}
.it .nt{white-space:pre-line}
.pmh{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:700;color:#8a8986;margin:4px 0 6px}
.pmh:not(:first-of-type){margin-top:18px}
.pmh small{font-size:11px;font-weight:500;color:#b4b3b0}
.pmr{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid rgba(0,0,0,.06)}
.pmt{font-size:14px;line-height:1.5;color:#37352F;outline:none;min-width:0;word-break:keep-all;overflow-wrap:break-word;border-radius:6px}
.pmt:focus{background:rgba(255,255,255,.6)}
.pm-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pm-actions button{min-height:36px;padding:6px;font-size:11px}
.pm-actions .es-x{opacity:.65}
.pm-pin.on{color:#4d6855;font-weight:700}
.pm-core{display:grid;gap:8px;margin-top:10px}
.pm-core-row{display:flex;gap:8px;align-items:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.55)}
.pm-core-open{flex:1;min-width:0;max-height:160px;overflow:hidden;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.pm-core-open small{display:block;font-size:11px;color:#888;margin-bottom:4px}
.pm-history-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.pm-history-head .pmh{margin:0;flex:1}
.pm-history-head button{min-height:36px}
@media(max-width:600px){.pmr{grid-template-columns:42px minmax(0,1fr);gap:6px}.pm-actions{grid-column:2}.pmh{flex-wrap:wrap}.pm-core-row .link{min-height:40px;flex:none}}
/* 하위의 하위 */
.sub.lv1{margin-left:18px}.sub.lv2{margin-left:36px}
.sub .ssb{border:0;background:none;color:#9b9a97;font-size:12px;line-height:1;padding:2px 4px;margin-left:auto;border-radius:5px;opacity:0;flex:none}
.sub:hover .ssb{opacity:1}.sub .ssb:hover{background:rgba(55,53,47,.08)}
@media(hover:none){.sub .ssb{opacity:.5}}
.es-sr.lv1{padding-left:22px}.es-sr.lv2{padding-left:44px}
/* 음력 */
.mc>b .lun{margin-left:auto;font-style:normal;font-size:10px;font-weight:500;color:#b4b3b0;letter-spacing:-.02em;padding-right:16px}
.mc>b .lun.key{color:#8a8986;font-weight:700}
.wh .lun{font-style:normal;font-size:10.5px;color:#b4b3b0;margin-left:6px}
.wh .lun.key{color:#8a8986;font-weight:700}
.lunt{font-size:11px;font-weight:500;color:#9b9a97;margin-left:8px}
@media(max-width:900px){.mc>b .lun{padding-right:0;font-size:9px}.mc>b .lun:not(.key){display:none}}
/* 하위 지우기 */
.sub .ssx{border:0;background:none;color:#b4b3b0;font-size:13px;line-height:1;padding:1px 4px;margin-left:auto;border-radius:5px;opacity:0;flex:none}
.sub .ssx+.ssb{margin-left:0}
.sub:hover .ssx{opacity:1}.sub .ssx:hover{background:rgba(154,74,66,.1);color:#9A4A42}
@media(hover:none){.sub .ssx{opacity:.5}}
/* 탭 바꿀 때 화면 흔들림 방지 (스크롤바 자리 고정) */
html{scrollbar-gutter:stable}
/* 달력 칩 · 하위 끌기 */
.mc i[draggable]{cursor:grab}
.mc i.dragging,.sub.dragging,.es-sr.dragging{opacity:.4}
.mc i.dropbefore{box-shadow:0 -2px 0 #37352F!important}
.sub[draggable]{cursor:grab}
.sub.sbefore,.es-sr.sbefore{box-shadow:0 -2px 0 #37352F}
.es-hd{color:#c4c3c0;font-size:12px;letter-spacing:-2px;cursor:grab;padding:4px 2px;flex:none;user-select:none}
.es-sr:hover .es-hd{color:#8a8986}
/* × 바로 지우기 */
.ix{border:0;background:none;color:#b4b3b0;font-size:14px;line-height:1;padding:2px 5px;border-radius:6px;opacity:0;flex:none;cursor:pointer}
.it:hover .ix,.fbr:hover .ix,.lfb:hover .ix,.dr:hover .ix,.ix:focus{opacity:1}
.ix:hover{background:rgba(154,74,66,.1);color:#9A4A42}
@media(hover:none){.ix{opacity:.45}}
.wc:not(.big) .it .ix{display:none}
.it .ix{margin-left:-4px}
.lfb .ix{align-self:start}
/* 비용 분류 */
.pcg{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:8px;align-items:baseline;padding:10px 0 6px;border-top:1px solid rgba(0,0,0,.08);margin-top:2px}
.pcg-t{border:0;background:none;color:#9b9a97;font-size:11px;padding:0;cursor:pointer;line-height:1}
.pcg-n{font-size:14px;font-weight:700;color:#37352F;cursor:text;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcg>span{font-size:11.5px;color:#9b9a97}
.pcg-s{font-size:14.5px;font-weight:800;color:#37352F;padding-right:30px}
.pc-r.in{padding-left:20px}
.pc-r[draggable]{cursor:grab}
.pcdrop{box-shadow:inset 0 0 0 1.5px #37352F;border-radius:8px}
.pc-gs{flex:none;max-width:110px;border:0;background:rgba(55,53,47,.06);border-radius:9px;padding:7px 8px;font:inherit;font-size:12.5px;font-weight:700;color:#37352F;cursor:pointer}
.pc-tip{font-size:11.5px;color:#b4b3b0;margin:8px 0 0;line-height:1.5}
@media(max-width:600px){.pc-in{flex-wrap:wrap}.pc-in .sp-in{flex-basis:100%}.pc-tip{display:none}}
/* 눌러서 고치기 */
.xe{cursor:pointer;border-radius:5px}
.xe:hover{background:rgba(55,53,47,.06)}
.sub .sxt{cursor:text;border-radius:4px;min-width:0;flex:1}
.sub .sxt:hover{background:rgba(55,53,47,.05)}
.sub .sed{flex:1;min-width:0;border:0;outline:0;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(55,53,47,.2);border-radius:5px;font:inherit;font-size:inherit;padding:1px 6px;color:#37352F}
/* 일정도 눌러서 끝냄 표시 */
button.evd{border:0;background:none;padding:6px 0 0;cursor:pointer;align-self:flex-start}
button.evd:hover::before{box-shadow:0 0 0 3px rgba(55,53,47,.15)}
.it .evd.on::before{background:transparent!important;box-shadow:inset 0 0 0 1.5px #9b9a97}
/* 타임라인 체크 */
.tl .ti i[data-tck]{width:14px;height:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative}
.tl .ti i[data-tck]:hover{transform:scale(1.25);box-shadow:0 0 0 2px #37352F}
.tl .ti.e i[data-tck]{width:11px;height:11px}
.tl .ti.e i[data-tck]:hover{transform:rotate(45deg) scale(1.25)}
.tl .ti.f i[data-tck]::after{content:'';position:absolute;left:4.5px;top:2px;width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.tl .ti.f span{text-decoration:line-through;text-decoration-color:rgba(55,53,47,.35)}
/* 그 자리에서 고치기 */
[data-ie]{cursor:text}
.ieon{outline:none;background:rgba(255,255,255,.9)!important;box-shadow:0 0 0 1.5px #37352F;border-radius:4px;padding:0 3px;margin:0 -3px;white-space:normal!important;text-decoration:none!important;color:#37352F!important}
.mc i .ieon{color:#37352F!important}
/* 타임라인 점은 원래 크기로 */
.tl .ti i[data-tck]{width:10px!important;height:10px!important}
.tl .ti.e i[data-tck]{width:9px!important;height:9px!important}
.tl .ti.f i[data-tck]::after{left:3.3px;top:1.3px;width:2px;height:4.5px;border-width:0 1.3px 1.3px 0}
.tl .ti i[data-tck]:hover{transform:scale(1.3)}
/* 타임라인: 현황 날짜는 네모 태그로 구분 */
.tl .ti.h i{width:9px;height:9px;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1.5px #8a8986}
.tl .ti.h span{background:rgba(55,53,47,.06);box-shadow:none;color:#5f5e5a}
.tl .ti.h span::after{content:'현황';margin-left:6px;font-size:10px;font-weight:700;color:#9b9a97}
.tl .ti.hp{opacity:.55}
/* 음력 반복 */
.es-lu{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 0 10px 0;font-size:12.5px;color:#8a8986}
.es-lu label{display:inline-flex;align-items:center;gap:6px;color:#6b6a66}
.es-lu input{width:70px;border:0;background:rgba(55,53,47,.06);border-radius:7px;padding:5px 8px;font:inherit;font-size:13px;color:#37352F}
/* 글 속 링크 */
.rt a{color:#2F5E8C!important;text-decoration:underline;text-decoration-color:rgba(47,94,140,.35);cursor:pointer}
.rt a:hover{text-decoration-color:#2F5E8C}
.lpop{position:absolute;z-index:200;display:flex;align-items:center;gap:2px;padding:5px;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);max-width:calc(100vw - 16px)}
.lpop .lpu{font-size:12px;color:#8a8986;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px 0 6px}
.lpop button{border:0;background:none;font-size:12.5px;font-weight:600;color:#37352F;padding:6px 9px;border-radius:7px;white-space:nowrap;cursor:pointer}
.lpop button:hover{background:rgba(55,53,47,.07)}
.lpop [data-lpx]{color:#9A4A42}
@media(max-width:600px){.lpop .lpu{display:none}}
/* 쓴 돈 분류 */
.spc{border:0;background:rgba(55,53,47,.06);color:#6b6a66;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;cursor:pointer;line-height:1.4;vertical-align:1px}
.spc:hover{background:rgba(55,53,47,.12);color:#37352F}
.spm{margin:2px 0 10px}
.spm-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:rgba(55,53,47,.06);gap:2px}
.spm-bar i{display:block;height:100%;background:#37352F}
.spm-l{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:#6b6a66}
.spm-l b{font-weight:700;color:#37352F;margin-right:2px}
.spm-t{display:block;font-size:10.5px;color:#b4b3b0;margin-top:4px}
a.ropen{padding:6px 10px!important;font-size:12px!important;text-decoration:none;color:#37352F;white-space:nowrap}
.nt a,.pmt a,.fbx a{color:#2F5E8C;text-decoration:underline;text-decoration-color:rgba(47,94,140,.35);word-break:break-all}
/* 링크: 파란 글씨 대신 칩 */
.rt a,.nt a,.pmt a,.fbx a{color:#37352F!important;text-decoration:underline;text-decoration-color:rgba(55,53,47,.3);text-underline-offset:3px}
a.lk{display:inline-flex;align-items:center;gap:5px;vertical-align:baseline;max-width:100%;padding:0 8px 0 6px;margin:0 1px;border-radius:6px;background:rgba(55,53,47,.07);color:#37352F!important;text-decoration:none!important;font-size:.92em;font-weight:500;line-height:1.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal!important;cursor:pointer;transition:background .12s}
a.lk::before{content:'';flex:none;width:14px;height:14px;border-radius:3px;background:var(--fav) center/14px no-repeat,rgba(55,53,47,.12)}
a.lk:hover{background:rgba(55,53,47,.13)}
.ilk{display:inline-flex;align-items:center;gap:3px;padding:0 7px;border-radius:6px;background:rgba(55,53,47,.06);color:#37352F!important;font-size:11.5px;text-decoration:none!important;line-height:1.7}
.ilk:hover{background:rgba(55,53,47,.12)}
/* 현황 칸 · 단계 고치기 */
.tch{display:flex;align-items:baseline;gap:10px}
.tch .link{font-size:12px}
.fe2{display:grid!important;grid-template-columns:minmax(0,1fr) 90px 28px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid rgba(0,0,0,.06)}
.fe2 .opw{grid-column:1/-1}
.opl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:10px;background:rgba(55,53,47,.04)}
.opc{display:inline-flex;align-items:center;background:#fff;border-radius:999px;box-shadow:0 0 0 1px rgba(55,53,47,.12);padding:0 2px 0 10px;cursor:grab}
.opc input{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:#37352F;padding:5px 0;min-width:2ch;outline:none}
.opc button{border:0;background:none;color:#9b9a97;font-size:13px;padding:2px 6px;border-radius:999px;cursor:pointer}
.opc button:hover{color:#9A4A42;background:rgba(154,74,66,.08)}
.opc.dragging{opacity:.4}
.opn{flex:1;min-width:120px;border:0;background:none;font:inherit;font-size:13px;padding:5px 4px;outline:none;color:#37352F}
.opp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:11.5px;color:#9b9a97}
.opp button{border:0;background:rgba(55,53,47,.06);color:#6b6a66;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;cursor:pointer}
.opp button:hover{background:rgba(55,53,47,.12)}
/* 토글 */
.rt .tgl{position:relative;padding-left:24px!important;font-weight:600;margin:2px 0}
.rt .tgl::before{content:'';position:absolute;left:5px;top:.55em;width:0;height:0;border-left:7px solid #55534e;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;transition:transform .15s;cursor:pointer}
.rt .tgl.open::before{transform:rotate(90deg)}
.rt .tgl::after{content:'';position:absolute;left:-2px;top:0;width:24px;height:1.5em;cursor:pointer}
.rt .tgc{padding-left:24px!important;margin-left:0;border-left:0}
.rt .tgc.hid{display:none}
.rt .tgl:not(.open)+.tgc:not(.hid){display:none}
/* 비용 메모 */
.xmt{border:0;background:none;color:#9b9a97;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px;border-radius:5px;cursor:pointer;vertical-align:1px}
.xmt:hover,.xmt.on{background:rgba(55,53,47,.08);color:#37352F}
.xmt.add{opacity:0}.pc-r:hover .xmt.add{opacity:1}
@media(hover:none){.xmt.add{opacity:.55}}
.xmemo{margin:-2px 0 8px 46px;padding:8px 12px;border-radius:8px;background:rgba(55,53,47,.045);font-size:12.5px;line-height:1.55;color:#55534e;white-space:pre-line;cursor:default}
.xmemo.in{margin-left:66px}
.hrp{grid-column:1/-1;margin:6px 0 8px;padding:10px 12px;border-radius:10px;background:rgba(55,53,47,.04)}
.hrp-h{display:flex;justify-content:space-between;font-size:12px;color:#8a8986;font-weight:700;margin-bottom:4px}.hrp-h b{color:#37352F}
.hrp-r{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13px;padding:3px 0}
.hrp-r em{font-style:normal;font-size:11.5px;color:#9b9a97}.hrp-r small{display:block;font-size:11.5px;color:#9b9a97}
#x-m{width:100%;resize:vertical}
/* 업체 줄 중심 */
.hm-n{color:#37352F;font-weight:600}
.hrt .it{font-size:13.5px}
.hrt .sp-in{margin-top:4px!important;font-size:13px}
.hrf .hrp{order:99}
.hrf [data-trdel]{order:100}
/* 콜아웃 · 토글: 제목 - 내용 */
.rt [data-ph]:has(> br:only-child)::after,.rt [data-ph]:empty::after{content:attr(data-ph);color:#b4b3b0;font-weight:500;pointer-events:none}
.rt .co{font-weight:700}
.rt .co:has(+ .coc){border-bottom-left-radius:0!important;border-bottom-right-radius:0!important;margin-bottom:0!important;border-bottom:0!important;padding-bottom:4px!important}

.rt .coc:not(:has(+ .coc)){border-bottom:1px solid rgba(55,53,47,.08);border-radius:0 0 10px 10px;padding-bottom:10px;margin-bottom:8px}
.rt .tgc[data-ph]:has(> br:only-child)::after{content:attr(data-ph)}
/* 빈 제목/내용 안내 글자: 줄바꿈 없이 그 자리에 */
.rt [data-ph]{position:relative}
.rt [data-ph]:has(> br:only-child)::after,.rt [data-ph]:empty::after{position:absolute;top:0;left:0;padding:inherit;white-space:nowrap}
.rt .co[data-ph]:has(> br:only-child)::after{padding:10px 14px 4px}
/* 시트 안 서식 메모 */
.es-p .es-memo{display:grid;grid-template-columns:inherit;align-items:start}
.es-rt{min-height:44px;padding:8px 10px!important;font-size:14px;border-radius:9px}
#sheet .f .es-rt{width:100%}
.xmemo.rt>*{margin-top:0}
.pmt.rt{padding:2px 4px}
/* 계약 구성 · 지급 */
.hri-r{display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;gap:6px;align-items:center;margin:0 0 5px}
.hri-r input{width:100%!important;min-width:0;margin:0!important;padding:7px 10px!important;font-size:13.5px!important;height:auto!important}
.hri-r input[data-f="a"]{text-align:right;font-weight:600}
.hri-r .es-x{opacity:.5}.hri-r:hover .es-x{opacity:1}
.hrp-rest{font-style:normal;font-weight:700;color:#9A4A42;margin-left:8px}.hrp-rest.ok,.hm-m b.ok{color:#4E7F5E}

.hrl{flex-wrap:wrap;row-gap:2px;min-width:0}
.hrl .hm{min-width:0;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;text-align:right}
@media(max-width:600px){.hrl .hm{flex-basis:100%;text-align:left;margin-left:0!important;font-size:12px}}
/* Unobtrusive rich-text nesting, shared by diary, record, project notes, task & expense memo. */
.rt[contenteditable] > [data-depth="1"],.rt.view > [data-depth="1"]{margin-left:18px}
.rt[contenteditable] > [data-depth="2"],.rt.view > [data-depth="2"]{margin-left:36px}

function parseAmountEntry(v){v=String(v||'').replace(/，/g,',').trim();const matches=[...v.matchAll(/\d[\d,]*(?:\.\d+)?\s*(?:만\s*원?|천\s*원?|원)?/g)];const candidates=matches.filter(m=>{const unit=/만|천|원/.test(m[0]),before=v[m.index-1],after=v[m.index+m[0].trimEnd().length];return unit||((!before||/\s/.test(before))&&(!after||/\s/.test(after)))});const money=candidates.filter(m=>/만|천|원/.test(m[0]));if(money.length>1||(!money.length&&candidates.length!==1))return null;const m=money[0]||candidates[0];if(!m)return null;const raw=m[0].trim(),num=raw.match(/^[\d,]+(?:\.\d+)?/)[0];if(num.includes(',')&&!/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(num))return null;let a=+num.replace(/,/g,'');if(/만/.test(raw))a*=10000;else if(/천/.test(raw))a*=1000;a=Math.round(a);if(!Number.isSafeInteger(a)||a<=0)return null;return {a,t:(v.slice(0,m.index)+' '+v.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim()}}

document.addEventListener('click',async e=>{const t=e.target;if(!t.closest)return;if(t.closest('[data-local-recovery]')){showLocalRecovery();return}const b=t.closest('[data-recover-edit]');if(!b||b.disabled)return;const d=localEdits()[b.dataset.recoverEdit];if(!d)return;b.disabled=true;try{const now=Date.now(),value={title:'복구 · '+(d.label||d.day||'기록'),html:d.html||d.patch?.html||d.patch?.memoH||d.patch?.h||t2h(d.patch?.t||d.patch?.title||d.patch?.name||d.patch?.d||''),space:d.space||'work',pid:'',fid:'',created:now,updated:now};const ref=await addDoc(col('notes'),value);if(!D.notes.some(n=>n.id===ref.id))D.notes.push({id:ref.id,...value});const edits=localEdits();if(edits[d.key]?.version===d.version){delete edits[d.key];storeEdits(edits)}closeSheet();U.sp=value.space;go('rec',{rt:'doc',doc:ref.id,q:''});updateSaveStatus();toast('임시 편집을 새 글로 보관했어요')}catch(_){toast('복구하지 못했어요. 임시 편집은 이 기기에 남아 있어요')}finally{b.disabled=false}});

/* ================= 나의 기록: 공간별 보관함과 공통 탐색 ================= */
const archiveState={work:{kind:'',month:'',pid:'',limit:40},life:{kind:'',month:'',pid:'',limit:40}};
const ARCHIVE_KIND={doc:'글',mom:'기록',log:'일지',pmemo:'프로젝트 메모',expense:'지출',todo:'할 일',ref:'자료',project:'프로젝트',fb:'피드백'};
function recordSpace(x,kind){const p=x.pid&&PJ(x.pid);return p?SPo(p):kind==='expense'?(x.sp||'life'):SPo(x)}
function recordDate(ms){return ms?ymd(new Date(ms)):T()}
function archiveEntries(allTodos=false,includeProjects=false){const rows=[];
 const put=(kind,x,title,body,date,pid='',extra='')=>rows.push({kind,id:x.id,title:title||ARCHIVE_KIND[kind],body:body||'',date:date||T(),pid,extra,stamp:x.updated||x.at||x.created||0});
 docs().filter(n=>recordSpace(n,'doc')===U.sp).forEach(n=>put('doc',n,n.title,txt(n.html),n.date||recordDate(n.updated||n.created),n.pid));
 D.moms.filter(m=>recordSpace(m,'mom')===U.sp).forEach(m=>{const body=txt(m.h||'')||m.t||'';put('mom',m,body.split('\n')[0]||'사진 기록',body,m.d||recordDate(m.at),m.pid,momImgs(m).length?`사진 ${momImgs(m).length}장`:'')});
 Object.entries(getLogs(U.sp)).filter(([,v])=>!isEmptyH(v.html)).forEach(([k,v])=>put('log',{id:k},`${md(k)} ${LW(U.sp).t}`,txt(v.html),k));
 D.projects.filter(inSp).forEach(p=>{if(!isEmptyH(p.memoH||''))put('pmemo',p,`${p.name} · 메모`,txt(p.memoH),recordDate(p.updated||p.created),p.id);if(includeProjects)put('project',p,p.name,'',p.start||recordDate(p.created),p.id)});
 D.exps.filter(e=>recordSpace(e,'expense')===U.sp).forEach(e=>put('expense',e,e.t||'지출',txt(e.memoH||'')||e.memo||'',e.d||recordDate(e.created),e.pid,`${won(expAmt(e))}원 · ${costCategory(e.c)||'분류 없음'}`));
 D.todos.filter(t=>inSp(t)&&(allTodos||t.done||(isEv(t)&&endOf(t)&&endOf(t)<T()))).forEach(t=>put('todo',t,t.title,[txt(t.noteH||'')||t.note||t.memo||'',...(t.subs||[]).map(s=>s.t),t.loc||'',t.link||''].filter(Boolean).join('\n'),t.done?doneDay(t)||recordDate(t.doneAt||t.created):t.date||recordDate(t.created),t.projectId,`${isEv(t)?'일정':'할 일'} · ${t.done?'완료':isEv(t)&&endOf(t)<T()?'지난 일정':'진행 중'}`));
 D.refs.filter(inSp).forEach(r=>put('ref',r,r.title,txt(r.html),recordDate(r.updated||r.created)));
 fbL().forEach(f=>put('fb',f,f.t,f.n||'',fbLast(f)||recordDate(f.created),'',FBK[f.k||'m'].l));
 return rows.sort((a,b)=>b.date.localeCompare(a.date)||b.stamp-a.stamp||a.kind.localeCompare(b.kind)||a.id.localeCompare(b.id))}
function archiveMatches(r,q){const hay=[r.title,r.body,r.date,r.extra,ARCHIVE_KIND[r.kind],r.pid&&PJ(r.pid)?.name].filter(Boolean).join(' ').toLowerCase();return q.trim().toLowerCase().split(/\s+/).every(word=>hay.includes(word))}
function archiveHighlight(s,q){s=String(s||'');q=q.trim();const i=q?s.toLowerCase().indexOf(q.toLowerCase()):-1;if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))}
function archiveRow(r,q='',search=false){const p=r.pid&&PJ(r.pid),body=r.body===r.title?'':r.body;
 return `<button type="button" class="archive-row${search?' dr':''}" ${search?'data-sgo':'data-archive-open'}="${r.kind}" data-id="${esc(r.id)}"><span class="archive-kind">${esc(ARCHIVE_KIND[r.kind])}</span><span class="archive-content"><strong>${archiveHighlight(r.title,q)}</strong>${body?`<span class="archive-excerpt">${archiveHighlight(body,q)}</span>`:''}<span class="archive-context">${esc([r.date,p?p.name:'',r.extra].filter(Boolean).join(' · '))}</span></span></button>`}
function archiveSearchHTML(q,search=false){if(!q.trim())return `<div class="archive-empty">${U.sp==='work'?'WORK':'LIFE'} 안의 기록·할 일·지출을 찾아보세요.</div>`;const rows=archiveEntries(true,true).filter(r=>archiveMatches(r,q));return rows.length?`<p class="archive-help">${rows.length}개${rows.length>80?' · 처음 80개를 표시해요. 검색어를 더해 좁혀보세요.':''}</p>${rows.slice(0,80).map(r=>archiveRow(r,q,search)).join('')}`:'<div class="archive-empty">찾는 내용이 없어요.<br>다른 검색어로 찾아보세요.</div>'}
function archiveView(){const state=archiveState[U.sp],all=archiveEntries(),months=[...new Set(all.map(r=>r.date.slice(0,7)))].sort().reverse(),projects=D.projects.filter(inSp);
 const match=r=>(!state.kind||(state.kind==='record'?['doc','mom','log','pmemo','fb'].includes(r.kind):r.kind===state.kind))&&(!state.month||r.date.startsWith(state.month))&&(!state.pid||r.pid===state.pid),rows=all.filter(match);let day='';
 const feed=rows.slice(0,state.limit).map(r=>{const head=day!==r.date?`<h3 class="archive-day">${r.date.replace(/-/g,'. ')} · ${DOW[P(r.date).getDay()]}</h3>`:'';day=r.date;return head+archiveRow(r)}).join('');
 return `<section class="archive"><div class="archive-intro"><div><h2>${U.sp==='work'?'일하며 쌓은 기록':'나의 일상 보관함'}</h2><p>${U.sp==='work'?'한 일, 배운 것, 기억할 순간을 모아요.':'일상, 생각, 끝낸 일들을 차곡차곡 모아요.'}</p></div><button class="ink" data-record-new="">＋ 기록 남기기</button></div>
 <div class="archive-tools" aria-label="기록 종류">${[['','전체'],['record','기록'],['todo','할 일·일정'],['expense','지출'],['ref','자료']].map(([k,l])=>`<button data-archive-filter="${k}" class="${state.kind===k?'on':''}" aria-pressed="${state.kind===k}">${l}</button>`).join('')}</div>
 <div class="archive-tools"><select data-archive-month aria-label="기록 월"><option value="">모든 달</option>${[...new Set([...months,...(state.month?[state.month]:[])])].sort().reverse().map(m=>`<option value="${m}"${m===state.month?' selected':''}>${m.replace('-','년 ')}월</option>`).join('')}</select><select data-archive-project aria-label="기록 프로젝트"><option value="">모든 프로젝트</option>${projects.map(p=>`<option value="${esc(p.id)}"${state.pid===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select><span class="archive-help">${rows.length}개의 기록</span>${state.kind||state.month||state.pid?'<button data-archive-reset>필터 초기화</button>':''}</div>
 <div class="g box archive-list">${feed||`<div class="archive-empty">${all.length?'조건에 맞는 기록이 없어요.':'아직 쌓인 기록이 없어요.<br>오늘 기억하고 싶은 것부터 남겨보세요.'}</div>`}${rows.length>state.limit?'<button class="soft" data-archive-more>이전 기록 더 보기</button>':''}</div><p class="archive-help">일지·글·메모와 완료한 일, 지난 일정, 지출을 함께 돌아볼 수 있어요.</p></section>`}
function projectRecordsHTML(p){const rows=archiveEntries().filter(r=>r.pid===p.id&&r.kind!=='todo');return `<section class="g box project-records"><h2 class="ct">관련 기록 · 비용<small>${rows.length}개</small></h2><div class="archive-tools"><button data-record-new="${esc(p.id)}">＋ 기록 남기기</button><button data-newdoc data-project="${esc(p.id)}">＋ 글 쓰기</button><button data-record-link="${esc(p.id)}">기존 글 연결</button></div><div class="archive-list">${rows.map(r=>archiveRow(r)).join('')||'<div class="archive-empty">이 프로젝트의 기록이 여기에 모여요.</div>'}</div></section>`}
function openArchiveItem(kind,id){
 if(kind==='doc'){const n=D.notes.find(n=>n.id===id);if(n){U.sp=recordSpace(n,'doc');go('rec',{rt:'doc',doc:id,q:''})}return}
 if(kind==='mom'){const m=D.moms.find(m=>m.id===id);if(m)recordSheet(m);return}
 if(kind==='expense'){const x=D.exps.find(x=>x.id===id);if(x)xSheet(x);return}
 if(kind==='todo'){editTodo(id);return}
 if(kind==='project'||kind==='pmemo'){const p=PJ(id);if(p){U.sp=SPo(p);if(kind==='pmemo')memoOpen=id;go('proj',{pid:id});if(kind==='pmemo')flash(`[data-pmemo="${id}"]`)}return}
 if(kind==='log'){go('rec',{rt:'log',doc:'',ry:+id.slice(0,4),rm:+id.slice(5,7),editLog:id,q:'',lfb:0});flash(`[data-log="${id}"]`,'.lday');return}
 if(kind==='ref'){go('rec',{rt:'ref',doc:'',q:''});const row=$$('[data-oref]').find(el=>el.dataset.oref===id);if(row)row.click();return}
 if(kind==='fb'){const f=D.fbk.find(f=>f.id===id);if(f)fbSheet(f)}
}
function recordSheet(m=null,pid=''){const space=m?recordSpace(m,'mom'):U.sp,ps=D.projects.filter(p=>SPo(p)===space),key=recordDraftKey(space,m?.id,pid);let draft=null;try{draft=JSON.parse(LS(key)||'null')}catch(_){}const selected=draft?.pid??(m?m.pid||'':pid);
 openSheet(`<h3>${m?'기록 돌아보기':'기록 남기기'} · ${space==='work'?'WORK':'LIFE'}</h3><div class="f"><span>날짜</span><input id="record-day" type="date" value="${esc(draft?.day||(m?m.d||T():T()))}"></div><div class="f"><span>프로젝트 (선택)</span><select id="record-project"><option value="">연결 안 함</option>${ps.map(p=>`<option value="${esc(p.id)}"${selected===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="rt well record-editor" id="record-body" contenteditable="true" data-ph="오늘의 생각, 기억할 일, 남기고 싶은 이야기…">${draft?safeHTML(draft.html||''):m?m.h?safeHTML(m.h):t2h(m.t||''):''}</div>${m&&momImgs(m).length?`<div class="pics sm">${momImgs(m).map(imgTag).join('')}</div>`:''}<p id="record-draft-status" class="archive-help">${draft?'이 기기에 남아 있던 내용을 복구했어요.':''}</p><p class="archive-help">${space==='work'?'WORK':'LIFE'}에 남겨요. 프로젝트를 고르면 관련 기록에서도 볼 수 있어요.</p><div class="bt"><button class="soft" data-sx="0">닫기</button><button class="ink" data-record-save="${m?esc(m.id):''}" data-space="${space}">저장</button></div>`);$('#record-body').dataset.draftKey=key;hydr($('#sheet'))}
function linkRecordSheet(pid){const p=PJ(pid);if(!p)return;const available=docs().filter(n=>recordSpace(n,'doc')===SPo(p)&&(!n.pid||!PJ(n.pid)));
 openSheet(`<h3>${esc(p.name)} · 기존 글 연결</h3><p class="archive-help">같은 공간에 있는, 아직 프로젝트에 연결하지 않은 글을 선택해 주세요.</p>${available.length?`<div class="f"><select id="record-existing" aria-label="연결할 글">${available.map(n=>`<option value="${esc(n.id)}">${esc(n.title||'제목 없음')}</option>`).join('')}</select></div>`:'<div class="archive-empty">연결할 글이 없어요.<br>새 기록을 남기거나, 글 화면에서 프로젝트를 바꿀 수 있어요.</div>'}<div class="bt"><button class="soft" data-sx="0">닫기</button>${available.length?`<button class="ink" data-record-attach="${esc(pid)}">연결</button>`:''}</div>`)}
document.addEventListener('click',async e=>{const t=e.target;if(!t.closest)return;let b;
 if((b=t.closest('[data-archive-open]'))){openArchiveItem(b.dataset.archiveOpen,b.dataset.id);return}
 if((b=t.closest('[data-record-new]'))){recordSheet(null,b.dataset.recordNew);return}

 if((b=t.closest('[data-record-save]'))){if(b.disabled)return;const id=b.dataset.recordSave,m=id&&D.moms.find(m=>m.id===id),h=outHTML($('#record-body')),p=PJ($('#record-project').value);if(isEmptyH(h)&&!(m&&momImgs(m).length)){toast('기억하고 싶은 내용을 적어 주세요');$('#record-body').focus();return}if($('#record-day').value&&!validDate($('#record-day').value)){toast('날짜를 확인해 주세요');return}const draftKey=$('#record-body').dataset.draftKey;const v={t:txt(h),h:isEmptyH(h)?'':h,d:$('#record-day').value||T(),pid:p?p.id:'',space:p?SPo(p):b.dataset.space,updated:Date.now()};const unlock=lockSheet(b);
  try{if(id){if(!m)return;await updateDoc(dc('moms',id),v);Object.assign(m,v)}else{const data={...v,at:Date.now(),imgs:[]},ref=await addDoc(col('moms'),data);if(!D.moms.some(m=>m.id===ref.id))D.moms.push({id:ref.id,...data})}unlock();if(b.isConnected)closeSheet();try{localStorage.removeItem(draftKey)}catch(_){}render();toast('기록을 남겼어요')}catch(_){toast('저장하지 못했어요. 내용을 유지했으니 다시 시도해 주세요')}finally{unlock()}return}
 if((b=t.closest('[data-record-attach]'))){if(b.disabled)return;const p=PJ(b.dataset.recordAttach),n=D.notes.find(n=>n.id===$('#record-existing')?.value);if(!p||!n||recordSpace(n,'doc')!==SPo(p)||(n.pid&&PJ(n.pid)))return;b.disabled=true;
  try{await updateDoc(dc('notes',n.id),{pid:p.id,updated:Date.now()});n.pid=p.id;closeSheet();render();toast('원래 글을 프로젝트에 연결했어요')}catch(_){toast('연결하지 못했어요. 다시 시도해 주세요')}finally{b.disabled=false}}
});
