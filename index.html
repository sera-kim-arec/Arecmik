<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arecmik</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" href="icon-192-lemon.png">
<link rel="apple-touch-icon" href="apple-touch-icon-lemon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar | main view | right panel. Clean neutral grays, lemon as the one brand accent. */
:root{
  --bg:#FFFFFF; --side:#F7F7F9; --panel:#FBFBFC; --surface:#FFFFFF; --sunken:#F2F2F5; --hover:#EDEDF1; --dim:#FAFAFB;
  --line:#E6E6EB; --line-soft:#F0F0F3;
  --fg:#1D1D1F; --fg2:#48484A; --muted:#6E6E73; --faint:#AEAEB2;
  --lemon:#F5D547; --lemon-soft:#FFF4C2; --lemon-ink:#6B5300; --on-lemon:#1D1D1F; --sel:#FFFBEA;
  --blue:#2F6FDB; --blue-soft:#E8EFFC; --blue-ink:#1F4FA8;
  --green:#2E8B57; --green-soft:#E3F2E9; --green-ink:#1E6B40;
  --violet:#7A5AC8; --violet-soft:#EEE8FA; --violet-ink:#5A3FA0;
  --rose:#C0392B; --rose-soft:#FBE9E7; --rose-ink:#9A2D22;
  --ink-btn:#1D1D1F; --ink-btn-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.07); --shadow-md:0 8px 24px rgba(0,0,0,.10); --shadow-lg:0 24px 60px rgba(0,0,0,.22);
  --scrim:rgba(20,20,22,.32);
  --font:'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151517; --side:#1B1B1E; --panel:#19191C; --surface:#1F1F23; --sunken:#29292E; --hover:#2E2E34; --dim:#19191C;
  --line:#34343A; --line-soft:#2A2A2F;
  --fg:#F2F2F5; --fg2:#D1D1D6; --muted:#9A9AA2; --faint:#5E5E66;
  --lemon:#E9C93A; --lemon-soft:#3A3315; --lemon-ink:#F3DE84; --on-lemon:#1D1D1F; --sel:#24221A;
  --blue:#6E9BF0; --blue-soft:#1E2A42; --blue-ink:#A9C3F7;
  --green:#5CC08A; --green-soft:#1B3326; --green-ink:#9ADBB6;
  --violet:#A98BEB; --violet-soft:#2A2340; --violet-ink:#CBB8F5;
  --rose:#F07A6C; --rose-soft:#3A1F1C; --rose-ink:#F6B0A7;
  --ink-btn:#F2F2F5; --ink-btn-fg:#151517;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#151517; --side:#1B1B1E; --panel:#19191C; --surface:#1F1F23; --sunken:#29292E; --hover:#2E2E34; --dim:#19191C;
  --line:#34343A; --line-soft:#2A2A2F;
  --fg:#F2F2F5; --fg2:#D1D1D6; --muted:#9A9AA2; --faint:#5E5E66;
  --lemon:#E9C93A; --lemon-soft:#3A3315; --lemon-ink:#F3DE84; --on-lemon:#1D1D1F; --sel:#24221A;
  --blue:#6E9BF0; --blue-soft:#1E2A42; --blue-ink:#A9C3F7;
  --green:#5CC08A; --green-soft:#1B3326; --green-ink:#9ADBB6;
  --violet:#A98BEB; --violet-soft:#2A2340; --violet-ink:#CBB8F5;
  --rose:#F07A6C; --rose-soft:#3A1F1C; --rose-ink:#F6B0A7;
  --ink-btn:#F2F2F5; --ink-btn-fg:#151517;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.4); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55); color-scheme:dark; }

html,body{height:100%}
#app{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{flex:none}
.c-lemon{--pc:var(--lemon);--pc-bg:var(--lemon-soft);--pc-ink:var(--lemon-ink)}
.c-blue{--pc:var(--blue);--pc-bg:var(--blue-soft);--pc-ink:var(--blue-ink)}
.c-green{--pc:var(--green);--pc-bg:var(--green-soft);--pc-ink:var(--green-ink)}
.c-violet{--pc:var(--violet);--pc-bg:var(--violet-soft);--pc-ink:var(--violet-ink)}
.c-rose{--pc:var(--rose);--pc-bg:var(--rose-soft);--pc-ink:var(--rose-ink)}

.app{position:relative;display:grid;grid-template-columns:var(--side-w, 252px) minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line-soft);overflow-y:auto;padding-block:16px 18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:12px;display:flex;flex-direction:column;gap:16px}
.main{overflow:auto;min-width:0;position:relative;background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:0 4px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--lemon);color:var(--on-lemon);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.seg{display:flex;background:var(--sunken);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;height:30px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.inline{display:inline-flex}
.seg .cnt{font-size:11px;color:var(--muted);margin-left:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--sunken);border-radius:8px;padding:0 10px;height:34px;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;font-size:13px;width:100%;min-width:0;color:var(--fg)}
.search kbd{font-family:inherit;font-size:10.5px;color:var(--muted);white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;border:0;background:transparent;font-size:13.5px;width:100%;text-align:left;cursor:pointer}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nav-item .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.sec{display:flex;flex-direction:column;gap:1px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 4px 10px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.mini{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mini:hover{background:var(--hover);color:var(--fg)}
.tree-row{display:flex;align-items:center;gap:2px;min-height:30px;border-radius:8px;padding-right:2px}
.tree-row:hover{background:var(--hover)}
.tree-row.on{background:var(--surface);box-shadow:var(--shadow)}
.tree-row.on .nm{font-weight:600}
.tree-row .tw{width:20px;height:24px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tree-row .nm{flex:1;min-width:0;display:flex;align-items:center;gap:7px;border:0;background:transparent;font-size:13px;text-align:left;cursor:pointer;padding:5px 2px;color:var(--fg)}
.tree-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .nm svg{color:var(--muted)}
.tree-row .cnt{font-size:12px;color:var(--muted);min-width:18px;text-align:right}
.tree-row .add{opacity:0}
.tree-row:hover .add,.tree-row .add:focus-visible{opacity:1}
.tree-doc{display:flex;align-items:center;gap:7px;min-height:28px;width:100%;border:0;background:transparent;border-radius:8px;font-size:12.5px;text-align:left;cursor:pointer;color:var(--fg2);padding-right:8px}
.tree-doc:hover{background:var(--hover)}
.tree-doc.on{background:var(--surface);box-shadow:var(--shadow);color:var(--fg);font-weight:600}
.tree-doc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-doc svg{color:var(--faint)}
.tree-input{flex:1;height:28px;border:1px solid var(--blue);border-radius:7px;padding:0 8px;font-size:13px;background:var(--surface);outline:none;min-width:0}
.side-foot{margin-top:auto;font-size:11.5px;line-height:1.55;color:var(--muted);padding:12px 6px 0;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.link-btn{border:0;background:transparent;padding:0;font-size:11.5px;color:var(--blue-ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.9;background:var(--ink-btn)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.sm.icon{width:28px;padding:0}
.btn.danger{color:var(--rose)}
.btn.warn{background:var(--rose);color:#FFFFFF;border-color:transparent}
.inp{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:var(--surface);color:var(--fg);min-width:0}
.inp:focus{outline:none;border-color:var(--blue)}
.muted{color:var(--muted)}
.grow{flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.empty{font-size:13px;color:var(--muted);padding:10px 4px;line-height:1.55}
.lbl{font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 2px 4px}
.h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.topbar .menu-btn{display:none}
.pager{display:flex;gap:4px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap;min-width:0}
.crumbs button{border:0;background:transparent;padding:2px 4px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:13px}
.crumbs button:hover{background:var(--hover);color:var(--fg)}
.crumbs b{color:var(--fg);font-weight:600}

/* WORK calendar */
.cal-wrap{display:flex;height:100%}
.cal-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.cal-wrap>.panel{overflow-y:auto}
.cal-scroll{overflow-x:auto;flex:1;display:flex;flex-direction:column}
.cal{min-width:720px;flex:1;display:flex;flex-direction:column}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.dow span{padding:8px 10px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);min-height:112px;flex:1 1 0}
.wk.sel{min-height:230px;flex:1.7 1 0}
.wk:last-child{border-bottom:1px solid var(--line)}
.cal-main>.cal-scroll{margin-bottom:var(--foot-gap, 0px)}
.cell{border-right:1px solid var(--line-soft);padding:5px 7px;min-width:0}
.cell.last{border-right:0}
.cell.other{background:var(--dim)}
.cell.other .num{color:var(--faint)}
.cell.we .num{color:var(--muted)}
.cell.selday{background:var(--sel)}
.drop-hi{outline:2px dashed var(--blue);outline-offset:-2px;background:var(--blue-soft)!important}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;border-radius:11px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.num.today{background:var(--lemon);color:var(--on-lemon)}
.today-tag{font-size:11px;font-weight:700;color:var(--lemon-ink);margin-left:4px}
.bar{position:relative;z-index:2;margin:1px 4px;height:22px;border-radius:6px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar.proj{background:var(--pc-bg);color:var(--pc-ink)}
.bar.ev{background:var(--surface);border:1.5px solid var(--blue);color:var(--blue-ink);height:20px}
.bar .bt{overflow:hidden;text-overflow:ellipsis}
.bar .meta{margin-left:auto;font-weight:500;opacity:.85;padding-left:8px}
.bar .dot{width:6px;height:6px;border-radius:3px;background:var(--blue)}
.handle{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:3}
.handle::after{content:"";position:absolute;right:3px;top:5px;bottom:5px;width:2.5px;border-radius:2px;background:currentColor;opacity:.4}
.items{position:relative;z-index:2;display:flex;flex-direction:column;gap:2px;padding:3px 5px 8px;min-width:0}
.chip{position:relative;display:flex;align-items:center;gap:5px;font-size:12px;min-height:23px;padding:2px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;color:var(--fg)}
.chip:hover{background:var(--hover)}
.chip .dot{width:6px;height:6px;border-radius:3px;flex:none}
.chip .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.chip .tt{overflow:hidden;text-overflow:ellipsis}
.chip.done .tt{text-decoration:line-through;color:var(--muted)}
.chip .handle{opacity:0;color:var(--blue)}
.chip:hover .handle{opacity:1}
.dragging{opacity:.35}
.more{border:0;background:transparent;text-align:left;font-size:11.5px;color:var(--muted);padding:2px 6px;cursor:pointer}
.chk{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--blue);background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:#FFFFFF}
.chk svg{opacity:0}
.chk.on{background:var(--faint);border-color:var(--faint)}
.chk.on svg{opacity:1}
.chk.lg{width:20px;height:20px;border-radius:6px}
body.resizing,body.resizing *{cursor:ew-resize!important;user-select:none}

.panel{width:var(--panel-w, 360px);box-sizing:border-box;flex:none;border-left:1px solid var(--line);background:var(--panel);padding-block:16px 32px;padding-left:16px;padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card-title{font-size:15px;font-weight:700;padding:2px 4px 8px}
.addline{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:9px;background:var(--sunken);color:var(--muted)}
.addline input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px;color:var(--fg);height:34px}
.tlist{display:flex;flex-direction:column;gap:1px;padding-top:6px}
.trow{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-radius:8px}
.trow:hover{background:var(--hover)}
.trow .grip{color:var(--faint);cursor:grab;padding-top:2px;display:flex}
.trow .chk{margin-top:2px}
.tlink{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:transparent;padding:0;text-align:left;font-size:13px;line-height:1.45;cursor:pointer;color:var(--fg)}
.trow.done .tlink>span:first-child{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--pc-bg);color:var(--pc-ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-btn{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-size:12px;color:var(--muted);padding:8px 4px 2px;cursor:pointer}
.day-h{display:flex;align-items:baseline;gap:6px;padding:0 2px 8px}
.day-h h2{margin:0;font-size:15px;font-weight:700}
.evrow{display:flex;gap:10px;width:100%;padding:8px;border:0;border-radius:9px;background:var(--blue-soft);text-align:left;cursor:pointer;color:var(--fg);margin-bottom:4px}
.evrow .eb{width:3px;border-radius:2px;background:var(--blue);flex:none}
.evrow .et{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:12px;color:var(--muted)}
.evrow .et b{font-size:13.5px;color:var(--fg);font-weight:600}
.evrow .et .pt{font-weight:600;color:var(--pc-ink)}
.projline{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 0}
.projline button{border:0;cursor:pointer}
.day-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.day-add .addline{flex:1 1 140px;min-width:0}
.day-add .btn{flex:none}
.addline{min-width:0}
.wk.sel .chip{white-space:normal;align-items:flex-start;overflow:visible;text-align:left}
.wk.sel .chip .tt{flex:1;min-width:0}
.wk.sel .chip .tt{overflow:visible;text-overflow:clip;line-height:1.4}
.wk.sel .chip .dot{margin-top:6px}
.wk.sel .chip .chk{margin-top:2px}

/* dialogs */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(56px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px))}
.dialog{position:relative;width:100%;max-width:600px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden}
.dialog.sm{max-width:460px}
.dlg-head{padding:16px 22px 16px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:12px}
.dlg-top{display:flex;align-items:center;gap:6px}
.kind{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--sunken);color:var(--fg2)}
.kind.ev{background:var(--blue-soft);color:var(--blue-ink)}
.kind.pr{background:var(--lemon-soft);color:var(--lemon-ink)}
.title-input{border:0;background:transparent;padding:0;font-size:23px;font-weight:700;letter-spacing:-.02em;outline:none;width:100%;color:var(--fg)}
.title-input::placeholder,.doc-title::placeholder{color:var(--faint)}
.fgrid{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 12px;align-items:center;font-size:13.5px}
.fgrid>label{color:var(--muted)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.dlg-body{padding:14px 22px 24px;display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:11px;border:2px solid transparent;background:var(--pc);cursor:pointer;padding:0}
.sw.on{border-color:var(--fg)}
.plist{display:flex;flex-direction:column;gap:1px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;font-size:13.5px}
.prow:hover{background:var(--hover)}
.prow .tlink{flex-direction:row;align-items:center;gap:8px}
.prow .sub{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* block editor */
.ed{display:flex;flex-direction:column;gap:1px;font-size:15px;line-height:1.65;min-width:0}
.ed.sm{font-size:13.5px;line-height:1.6}
.ed{padding-left:22px}
.bk{position:relative;display:flex;align-items:flex-start;gap:8px;padding-left:calc(var(--ind,0) * 26px);min-width:0}
.bk.sub::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--ind,0) * 26px - 17px);border-left:1px solid var(--line)}
.bk-tw{position:absolute;left:calc(var(--ind,0) * 26px - 22px);top:.3em;width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:0;z-index:1}
.bk:hover>.bk-tw,.bk-tw.closed,.bk-tw:focus-visible{opacity:1}
.bk-tw:hover{background:var(--hover)}
@media (min-width:861px){ .doc .ed{margin-left:-22px} }
.bk-more{flex:none;align-self:center;font-size:11.5px;color:var(--muted);background:var(--sunken);border-radius:6px;padding:1px 7px}
@media (hover:none){ .bk-tw{opacity:.7} }
.bk-text{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;padding:1px 2px;border-radius:4px}
.ed .bk-text:empty:focus::before,.ed.ed-empty .bk-text:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.bk-h .bk-text{font-size:1.28em;font-weight:700;letter-spacing:-.01em;padding-top:8px}
.bk-quote .bk-text{border-left:3px solid var(--line);padding-left:12px;color:var(--fg2);border-radius:0}
.bk-callout{background:var(--sunken);border-radius:10px;padding:8px 12px;margin:4px 0}
.bk-todo.done .bk-text{text-decoration:line-through;color:var(--muted)}
.bk .chk{margin-top:.38em;width:16px;height:16px;border-color:var(--faint)}
.bk .chk.on{background:var(--faint)}
.bk-dot{width:6px;height:6px;border-radius:3px;background:var(--fg);margin:.7em 5px 0 6px;flex:none;box-sizing:border-box}
.bk-dot.d1{background:transparent;border:1.5px solid var(--fg)}
.bk-dot.d2{border-radius:1px;width:5px;height:5px;margin-top:calc(.7em + .5px)}
.bk-num{min-width:20px;color:var(--fg2);font-variant-numeric:tabular-nums;padding-top:1px}
.bk-divider{padding:10px 0}
.bk-divider hr{width:100%;border:0;border-top:1px solid var(--line);margin:0}
.bk-link{flex-direction:column;gap:6px;align-items:stretch;padding-block:2px}
.bk-link .bk-text{font-size:12.5px;color:var(--muted)}
.link-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);font-size:13.5px;background:var(--surface)}
.link-card:hover{background:var(--hover)}
.link-card .lc-t{display:flex;flex-direction:column;min-width:0}
.link-card .lc-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-card .lc-t span{font-size:12px;color:var(--muted)}
.link-card .lc-i{width:34px;height:34px;border-radius:8px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.bk-img{position:relative;padding:4px 0}
.bk-img img{width:100%;max-height:440px;object-fit:cover;border-radius:10px;display:block}
.bk-img .btn{position:absolute;top:12px;right:8px}
.ed-tail{min-height:28px;cursor:text}
.slash{position:fixed;z-index:80;width:250px;max-height:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px}
.slash button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;font-size:13.5px;text-align:left;cursor:pointer;color:var(--fg)}
.slash button.on,.slash button:hover{background:var(--sunken)}
.slash .si{width:24px;height:24px;border-radius:6px;background:var(--sunken);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--fg2)}
.slash .sk{margin-left:auto;font-size:11.5px;color:var(--muted)}

/* pages */
.page{max-width:980px;margin:0 auto;padding:28px 28px 64px;display:flex;flex-direction:column;gap:18px}
.doc{max-width:740px;width:100%;box-sizing:border-box;margin:0 auto;padding:36px 32px 120px;display:flex;flex-direction:column;gap:12px}
.doc-title{border:0;background:transparent;font-size:32px;font-weight:700;letter-spacing:-.03em;outline:none;padding:0;width:100%;color:var(--fg)}
.h1-input{border:0;background:transparent;font-size:26px;font-weight:700;letter-spacing:-.02em;outline:none;padding:0;width:100%;color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--fg2);background:var(--surface)}
.pill select,.pill input{border:0;background:transparent;font-size:12.5px;outline:none;color:var(--fg)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.fcard{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--fg)}
.fcard:hover{background:var(--hover)}
.fcard svg{color:var(--muted)}
.fcard span.c{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.drow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line-soft);background:var(--surface);text-align:left;cursor:pointer;color:var(--fg)}
.drow:last-child{border-bottom:0}
.drow:hover{background:var(--hover)}
.drow .dt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.drow .dt b{font-size:14px;font-weight:600}
.drow .dt span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dm{font-size:12px;color:var(--muted);white-space:nowrap}
.foot-actions{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line-soft)}

/* projects gantt */
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gantt{min-width:900px}
.g-row{display:grid;grid-template-columns:230px repeat(var(--n),minmax(22px,1fr));min-height:52px;border-bottom:1px solid var(--line-soft)}
.g-row:last-child{border-bottom:0}
.g-head{min-height:34px;font-size:11px;color:var(--muted);font-weight:600}
.g-lab{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 12px;border:0;border-right:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;min-width:0;color:var(--fg)}
.g-head .g-lab{cursor:default}
.g-lab .gt{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.g-lab .gt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab .gm{font-size:11.5px;color:var(--muted)}
.pdot{width:8px;height:8px;border-radius:4px;background:var(--pc);flex:none}
.g-cell{grid-row:1;border-right:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center}
.g-cell.we{background:var(--dim)}
.g-cell.today{background:var(--sel)}
.g-day.today span{background:var(--lemon);color:var(--on-lemon);border-radius:9px;padding:1px 5px}
.g-bar{grid-row:1;align-self:center;height:26px;z-index:2;position:relative;border-radius:7px;background:var(--pc-bg);color:var(--pc-ink);font-size:11.5px;font-weight:600;display:flex;align-items:center;padding:0 12px 0 8px;white-space:nowrap;overflow:hidden;cursor:pointer;margin:0 2px}
.g-bar.done{opacity:.6}
.g-bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.g-bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}

/* LIFE */
.lpad{padding:16px 20px 0;display:flex;flex-direction:column;min-height:calc(100% - 62px - var(--foot-gap, 0px));box-sizing:border-box}
.ldow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:6px}
.ldow span{padding:0 4px}
.lgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,1fr);gap:6px;flex:1}
.lgrid .tile-wrap{display:flex}
.tile-wrap{position:relative;min-width:0}
.tile-add{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:14px;border:0;background:var(--surface);color:var(--fg);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s}
.tile-wrap:hover .tile-add,.tile-add:focus-visible{opacity:1}
@media (hover:none){ .tile-add{opacity:.92;width:24px;height:24px;top:4px;right:4px} }
.tdot{width:6px;height:6px;border-radius:3px;background:var(--faint);margin:0 0 4px 8px}
.tile{width:100%;height:auto;min-height:104px;border:0;border-radius:10px;background-color:var(--dim);background-size:cover;background-position:center;padding:7px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;cursor:pointer;text-align:left;min-width:0;color:var(--fg)}
.tile:hover{box-shadow:inset 0 0 0 1px var(--line)}
.tile.other{opacity:.45}
.tile.sel{box-shadow:0 0 0 2px var(--fg)}
.tile .n{font-size:12px;font-weight:600;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tile.has .n{background:rgba(0,0,0,.55);color:#FFFFFF}
.tile .n.today{background:var(--lemon);color:var(--on-lemon)}
.tile .lb{max-width:100%;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.86);color:#1D1D1F;padding:2px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{display:flex;gap:12px;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;color:var(--fg);margin-bottom:8px}
.rec:hover{background:var(--hover)}
.thumb{width:56px;height:56px;border-radius:8px;flex:none;background-color:var(--sunken);background-size:cover;background-position:center}
.thumb.book{width:40px;height:54px;border-radius:4px}
.rec-tx{display:flex;flex-direction:column;gap:3px;min-width:0;justify-content:center}
.rec-tx b{font-size:14px;font-weight:600}
.rec-tx .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftag{align-self:flex-start;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sunken);color:var(--fg2)}
.dash-btn{width:100%;height:42px;border:1px dashed var(--faint);border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--fg2);cursor:pointer}
.dash-btn:hover{background:var(--hover)}
.cover{height:220px;border-radius:14px;background-color:var(--sunken);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;box-sizing:border-box}
.cover-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.glass{background:rgba(255,255,255,.9);color:#1D1D1F;border:0}
.glass:hover{background:#FFFFFF}
.chk-lbl{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);text-align:left;cursor:pointer;padding:0;color:var(--fg)}
.pcard:hover{box-shadow:var(--shadow-md)}
.pcard .pc-c{aspect-ratio:16/10;background-color:var(--sunken);background-size:cover;background-position:center}
.pcard .pc-t{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.pcard .pc-t b{font-size:14.5px}
.pcard .pc-t span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipf{height:30px;padding:0 13px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--fg)}
.chipf.on{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:transparent;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.ccard{display:flex;flex-direction:column;gap:7px;border:0;background:transparent;text-align:left;cursor:pointer;padding:0;color:var(--fg);min-width:0}
.ccard .cv{aspect-ratio:3/4;max-width:100%;border-radius:8px;background-color:var(--sunken);background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(0,0,0,.10)}
.ccard:hover .cv{transform:translateY(-2px)}
.ccard b{font-size:14px;line-height:1.35}
.ccard .s{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sunken);color:var(--fg2)}
.badge.o{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.badge.hl{background:var(--lemon-soft);color:var(--lemon-ink)}
.stars{color:var(--lemon-ink);letter-spacing:1px;font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--dim);border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--hover)}
.tbl .mini-cv{width:32px;height:42px;border-radius:4px;background-size:cover;background-position:center}
.cv-row{display:flex;gap:14px;align-items:center}
.cv-prev{width:72px;height:96px;border-radius:8px;background-color:var(--sunken);background-size:cover;background-position:center;flex:none}
.rate{display:flex;gap:2px}
.rate button{border:0;background:transparent;font-size:18px;color:var(--faint);cursor:pointer;padding:0 2px;line-height:1}
.rate button.on{color:var(--lemon)}
.nc{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.nc-form{flex:999 1 420px;min-width:0;max-width:640px;display:flex;flex-direction:column;gap:22px}
.nc-prev{flex:1 1 220px;max-width:260px;display:flex;flex-direction:column;gap:10px}
.fieldset{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frow2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.frow2.fixed{background:var(--dim);font-size:13.5px;font-weight:600;padding:11px 12px}
.ficon{width:28px;height:28px;border-radius:7px;background:var(--sunken);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--fg2);flex:none}
.frow2 .inp{flex:1}
.frow2 .ty{font-size:12px;color:var(--muted);white-space:nowrap}
.tadd{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;background:var(--ink-btn);color:var(--ink-btn-fg);padding:10px 14px 10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-md);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--ink-btn-fg);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.sres{position:fixed;z-index:75;width:380px;max-width:calc(100vw - 32px);max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px}
.sres .sg{font-size:11px;font-weight:600;color:var(--muted);padding:8px 10px 4px}
.sres button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:var(--fg)}
.sres button:hover{background:var(--sunken)}
.sres button b{font-size:13.5px;font-weight:500}
.sres button.done b{text-decoration:line-through;color:var(--muted)}
.sres button span{font-size:12px;color:var(--muted)}
.nav-scrim{display:none}

@media (max-width:1100px){
  .cal-wrap{flex-direction:column;height:auto;min-height:100%}
  .cal-main,.cal-wrap>.panel{overflow:visible}
  .cal-main{min-height:calc(100vh - 1px)}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  .app.nav-open .side{transform:none}
  .app.nav-open .nav-scrim{display:block;position:fixed;inset:0;z-index:35;background:var(--scrim)}
  .topbar{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .topbar .menu-btn{display:inline-flex}
  .topbar .hint{display:none}
  .page,.doc{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .lpad{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .tile{min-height:64px}
  .lgrid{grid-auto-rows:minmax(64px,1fr)}
  .tile .lb{display:none}
  .cols2{grid-template-columns:minmax(0,1fr)}
}

/* ---- app shell: sign-in gate, sync state ---- */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.gate-box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:380px}
.gate-box .logo-svg{width:88px;height:88px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.gate-box h1{margin:4px 0 0;font-size:28px;letter-spacing:-.03em}
.gate-box p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}
.gbtn{margin-top:8px;height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--ink-btn);color:var(--ink-btn-fg);font-size:15px;font-weight:600;cursor:pointer}
.sync{display:flex;align-items:center;gap:7px;color:var(--fg2);font-weight:600}
.sync-dot{width:8px;height:8px;border-radius:4px;background:var(--faint)}
.sync-dot.ok{background:var(--green)}
.sync-dot.busy{background:var(--lemon)}
.sync-dot.warn{background:var(--rose)}
.foot-row{display:flex;flex-wrap:wrap;gap:4px 12px}
label.link-btn{cursor:pointer}
/* ---- week view + weekly log ---- */
.btn.on-soft{background:var(--lemon-soft);color:var(--lemon-ink);border-color:transparent;font-weight:600}
.dow .tdow{color:var(--lemon-ink)}
.wlog{padding:18px 20px 32px;display:flex;flex-direction:column;gap:16px}
.wlog-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:13px;color:var(--muted)}
.wlog-sum b{font-size:22px;color:var(--fg);margin-right:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wlog-ps{display:flex;flex-wrap:wrap;gap:6px}
.wlog-grid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.wlog-days{flex:999 1 420px;min-width:0;display:flex;flex-direction:column}
.wlog-note{flex:1 1 260px;max-width:100%;position:sticky;top:80px}
.lday{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.lday:last-child{border-bottom:0}
.lday-h{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.lday-h b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;padding:0 6px;border-radius:10px}
.lday-h span{font-size:12px;color:var(--muted)}
.lday.is-today .lday-h b{background:var(--lemon);color:var(--on-lemon)}
.lday.empty-day{padding:8px 0;align-items:center}
.lday.empty-day .lday-h{flex-direction:row;gap:6px;justify-content:center}
.lday.empty-day .lday-h b{font-size:14px;color:var(--muted)}
.lday-b{display:flex;flex-direction:column;gap:2px;min-width:0;justify-content:center}
.lrow{display:flex;gap:10px;align-items:flex-start;width:100%;padding:7px 8px;border:0;border-radius:9px;background:transparent;text-align:left;cursor:pointer;color:var(--fg)}
.lrow:hover{background:var(--hover)}
