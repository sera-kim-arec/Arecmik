<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arecmik</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Arecmik"><meta name="theme-color" content="#F7F7FA">
<style>
:root{--bg:#F4F5F7;--sf:#FFFFFF;--sf2:#F7F8FA;--hv:#EEF0F5;--ln:#E1E4EA;--ln2:#ECEEF2;--tx:#17203A;--tx2:#3E4659;--mu:#7D8597;--mu2:#B8BDC8;--ac:#1F2E5C;--ac2:#E8EBF3;--ac3:#D9DEEB;--act:#16224A;--seg:#E7E9EF;--sel:#F7F9FD;--life:#B8860B;--life2:#FFF4D2;--lifet:#6B5000;--sun:#C8463D;--sat:#3D63A8;--memo:#FFEDB5;--memot:#5A4300;--memol:#E8CF7A;--warn:#FFEDB5;--warn2:#5A4300;--dark:#17203A;--shc:23,32,58;--r:10px}
body[data-th=cloud]{--bg:#F5F7FA;--sf2:#F8FAFC;--hv:#EEF2F8;--ln:#E3E8EF;--ln2:#EDF1F6;--tx:#1D2433;--tx2:#434C5E;--mu:#8A94A6;--mu2:#C0C7D3;--ac:#3D6BE0;--ac2:#E8EEFC;--ac3:#D8E3FA;--act:#2550B8;--seg:#E8ECF2;--sel:#F5F8FF;--life2:#E6F5EF;--lifet:#1E6B52;--sun:#D64545;--sat:#3D6BE0;--memo:#FFF5D9;--memot:#6B5210;--memol:#EAD59A;--dark:#1D2433;--shc:30,45,80}
body[data-th=peach]{--bg:#FCF8F5;--sf2:#FDF9F6;--hv:#FAF1EC;--ln:#F0E6DF;--ln2:#F5EEE9;--tx:#33261F;--tx2:#5A4A41;--mu:#A08F84;--mu2:#D2C4BA;--ac:#E8775E;--ac2:#FDEDE8;--ac3:#FADCD3;--act:#B4503A;--seg:#F3EBE5;--sel:#FFF8F5;--life2:#EAF3EC;--lifet:#3E6B4A;--sun:#D2493E;--sat:#4F72A8;--memo:#FFF2C9;--memot:#6E5410;--memol:#EDD58E;--dark:#33261F;--shc:80,45,30}
body[data-th=lilac]{--bg:#F6F5F9;--sf2:#F9F8FC;--hv:#F1EFF7;--ln:#E6E3EE;--ln2:#EFEDF4;--tx:#28252F;--tx2:#4D4957;--mu:#8D889A;--mu2:#C8C4D4;--ac:#7C66D9;--ac2:#EFEBFB;--ac3:#E2DCF8;--act:#5440B0;--seg:#ECEAF2;--sel:#FAF9FE;--life2:#E5F3EF;--lifet:#245E52;--sun:#CF4B5B;--sat:#4D6FA8;--memo:#FBF1D6;--memot:#6A5212;--memol:#E5D3A0;--dark:#28252F;--shc:40,30,70}
body[data-th=ink]{--bg:#F4F4F2;--sf2:#F8F8F6;--hv:#EFEFEC;--ln:#E3E3DF;--ln2:#EEEEEA;--tx:#1C1C1E;--tx2:#46464A;--mu:#808084;--mu2:#BDBDBF;--ac:#2C2C30;--ac2:#ECECEA;--ac3:#E0E0DC;--act:#141416;--seg:#E8E8E5;--sel:#F9F9F7;--life2:#ECEFF4;--lifet:#34465E;--sun:#B8433A;--sat:#41618C;--memo:#FAF1D8;--memot:#5E4710;--memol:#E2D2A2;--dark:#1C1C1E;--shc:0,0,0}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--ac);flex:none;cursor:pointer}
[hidden]{display:none!important}

#login{max-width:380px;margin:0 auto;padding:24vh 16px 0;text-align:center}
#login h1{font-size:26px;font-weight:700;margin:0 0 8px}#login p{color:var(--mu);margin:0 0 24px}
.pri{background:var(--ac);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600}

#app{display:grid;grid-template-columns:minmax(0,1fr) 7px var(--rpw,320px);height:100vh;height:100dvh}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;padding:14px 10px 6px 18px}
.top{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.top h2{font-size:19px;font-weight:700;margin:0 8px 0 6px;letter-spacing:-.01em}
.nb{width:30px;height:30px;border-radius:8px;color:var(--mu);font-size:16px}.nb:hover{background:var(--sf);color:var(--tx)}
.tb{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);font-size:13px}
.seg{display:inline-flex;background:var(--seg);border-radius:9px;padding:2px}
.seg button{height:26px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(var(--shc),.08)}
.sp{flex:1}
.out{font-size:12px;color:var(--mu);padding:0 6px}

#cal{flex:var(--calf,1) 0 var(--calh,0px);min-height:260px;display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--ln)}
.dow b{font-size:11.5px;font-weight:500;color:var(--mu);padding:7px 8px}.dow b:first-child{color:var(--sun)}.dow b:last-child{color:var(--sat)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.c{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:4px 5px 4px;min-width:0;min-height:0;overflow:hidden;cursor:default;position:relative;display:flex;flex-direction:column}
.c:nth-child(7n){border-right:0}
.c.out2 .dn{color:var(--mu2)}.c.sel{background:var(--sel);box-shadow:inset 0 0 0 1.5px var(--ac)}
.ch{display:flex;align-items:center;gap:4px;height:22px;flex:none}
.dn{font-size:12.5px;font-weight:600;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;padding:0 4px}
.c.sun .dn,.c.hol .dn{color:var(--sun)}.c.sat .dn{color:var(--sat)}
.c.td .dn{background:var(--ac);color:#fff}
.hn{font-size:10.5px;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cadd{margin-left:auto;width:20px;height:20px;border-radius:6px;color:var(--mu);font-size:15px;line-height:20px;opacity:0}
.c:hover .cadd,.c.sel .cadd{opacity:1}.cadd:hover{background:var(--ac2);color:var(--ac)}
.ci{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;margin:0 -5px;padding:0 5px}
.it{display:flex;align-items:center;gap:5px;font-size:12px;line-height:18px;padding:0 4px;border-radius:5px;white-space:nowrap;min-width:0;cursor:pointer}
.it:hover{background:var(--hv)}
.it span{overflow:hidden;text-overflow:ellipsis}
.it input{width:13px;height:13px}
.it.dn2 span{color:var(--mu);text-decoration:line-through}
.it.ev{background:var(--ac2);color:var(--act)}.it.ev:hover{background:var(--ac3)}
.it.ev em{font-style:normal;font-size:11px;opacity:.8}
.life .it.ev,.it.ev.l{background:var(--life2);color:var(--lifet)}
.it.rg{border-radius:0;margin:0 -5px;padding-left:9px}.it.rg.s{margin-left:0;padding-left:4px}.it.rg.e{margin-right:0}.it.rg.s{border-radius:5px 0 0 5px}.it.rg.e{border-radius:0 5px 5px 0}.it.rg.s.e{border-radius:5px}
.it{position:relative}.rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;border-radius:0 5px 5px 0}
.it:hover .rz{background:color-mix(in srgb,var(--ac) 30%,transparent)}
.it[data-dk]:not(.sb),.row[data-id]{cursor:grab}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}body.dg-rz,body.dg-rz *{cursor:ew-resize!important}
.c.drop{background:var(--ac2)}.dg-src{opacity:.4}
.ghost{position:fixed;z-index:300;pointer-events:none;background:var(--ac);color:#fff;font-size:12px;padding:4px 9px;border-radius:7px;box-shadow:0 6px 18px rgba(var(--shc),.25);white-space:nowrap}
.it.rg:not(.ev){background:var(--hv)}
#qp{position:fixed;z-index:150;width:290px;background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 12px 32px rgba(var(--shc),.16);padding:10px}
.qph{display:flex;align-items:center;gap:8px;margin-bottom:8px}.qph b{font-size:13px;flex:1;white-space:nowrap}
.qph .seg button{height:24px;padding:0 9px;font-size:12px}
#qp input{padding:7px 9px;font-size:13px}
.qpf{font-size:11px;color:var(--mu);margin-top:6px}
.c.pick{background:var(--ac2)}
body.selecting,body.selecting *{user-select:none;cursor:cell!important}
.more{font-size:11px;color:var(--mu);padding:0 4px;cursor:pointer}
.qin{font-size:12px;padding:3px 6px;border-radius:6px;height:24px;margin-bottom:2px}

#rp{background:var(--sf);display:flex;flex-direction:column;min-height:0;overflow:auto;padding:16px 16px 24px}
.memo{background:var(--warn);border-radius:12px;padding:10px 12px 8px;margin-bottom:18px}
.memo label{font-size:11.5px;font-weight:600;color:var(--warn2);display:block;margin-bottom:2px}

.memo .ed{font-size:13px;color:#3F3208;min-height:44px}
.ed{outline:none;line-height:1.65;position:relative;word-break:break-word;counter-reset:n}
.ed.emp::before{content:attr(data-ph);position:absolute;left:0;top:0;color:var(--mu);pointer-events:none}
.ed>div{min-height:1.65em;position:relative}
.ed>div[data-d="1"]{margin-left:22px}.ed>div[data-d="2"]{margin-left:44px}.ed>div[data-d="3"]{margin-left:66px}.ed>div[data-d="4"]{margin-left:88px}
.ed>.h1{font-size:1.3em;font-weight:700;margin-top:4px}.ed>.h2{font-size:1.1em;font-weight:700;margin-top:2px}
.ed>.li,.ed>.num,.ed>.todo{padding-left:20px}
.ed>.li::before{content:'•';position:absolute;left:6px}
.ed>div:not(.num){counter-reset:n}.ed>.num{counter-increment:n}.ed>.num::before{content:counter(n)'.';position:absolute;left:0;font-variant-numeric:tabular-nums}
.ed>.todo::before{content:'';position:absolute;left:1px;top:.32em;width:13px;height:13px;border:1.5px solid var(--mu2);border-radius:3px;background:#fff;cursor:pointer}
.ed>.todo.on::before{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 2px #fff}
.ed>.todo.on{color:var(--mu);text-decoration:line-through}
.ed>.qt{border-left:3px solid var(--mu2);padding-left:10px;color:#5A5866}
.ed>div.cur::after{content:"'/' 를 눌러 제목·목록·체크 고르기";color:var(--mu2);pointer-events:none;position:absolute;left:0;top:0}
.ed>div.cur.li::after,.ed>div.cur.num::after,.ed>div.cur.todo::after{left:20px;content:'목록'}.ed>div.cur.h1::after{content:'제목'}.ed>div.cur.h2::after{content:'소제목'}.ed>div.cur.qt::after{left:13px;content:'인용'}
.slm{position:fixed;z-index:200;background:#fff;border:1px solid var(--ln);border-radius:10px;box-shadow:0 10px 30px rgba(var(--shc),.14);padding:4px;width:180px;max-height:280px;overflow:auto}
.slm button{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border-radius:6px;font-size:13px;text-align:left}
.slm button i{font-style:normal;width:22px;height:22px;border:1px solid var(--ln);border-radius:5px;display:grid;place-items:center;font-size:11px;color:var(--mu);background:var(--sf2)}
.slm button.on,.slm button:hover{background:var(--ac2)}.sle{font-size:12px;color:var(--mu);padding:6px 8px}
.bbl{position:fixed;z-index:200;display:flex;gap:2px;background:var(--dark);border-radius:8px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.bbl button{color:#fff;font-size:12.5px;padding:3px 8px;border-radius:5px;min-width:26px}.bbl button:hover{background:rgba(255,255,255,.15)}
.ed a::before{content:'🔗';margin-right:3px;font-size:.9em;text-decoration:none;display:inline-block}
.ed a{background:var(--ac2);border-radius:5px;padding:0 5px 0 3px;text-decoration:none!important;}
.ed a:hover{background:var(--ac3)}
.lp{width:270px}.lo,.lx{font-size:12px;color:var(--ac)}.lx{color:var(--mu)}
.ed a{color:var(--ac);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.etb{display:none!important;flex-wrap:wrap;gap:2px;margin:2px 0 6px;opacity:.35;transition:opacity .15s}
.edw:focus-within .etb,.edw:hover .etb{opacity:1}
.etb button{font-size:12px;min-width:24px;padding:2px 6px;border-radius:6px;color:var(--mu);line-height:20px}.etb button:hover{background:rgba(0,0,0,.06);color:var(--tx)}
.memo .etb button{color:var(--memot)}
.dme{border:1px solid var(--ln);border-radius:8px;padding:8px 10px}.dme:focus-within{border-color:var(--ac)}.dme .ed{min-height:60px;font-size:13.5px}
.isa{margin-left:auto;width:20px;height:18px;border-radius:5px;color:var(--mu);font-size:12px;line-height:18px;flex:none;opacity:0}
.it .isa{display:none;opacity:1}.it:hover .isa{display:block}.row:hover .isa{opacity:1}.isa:hover{background:var(--ac2);color:var(--ac)}
.row .isa{height:22px;width:24px;font-size:13px}
.it.sb{padding-left:calc(14px + var(--d,0)*10px);font-size:11.5px;color:#55535F;background:none}
.it.sb input{width:11px;height:11px}
.srow{display:flex;align-items:center;gap:8px;padding:4px 4px 4px calc(28px + var(--d,0)*18px);font-size:13px;color:var(--tx2);cursor:pointer;border-radius:6px}
.srow:hover{background:var(--hv)}.srow input{width:13px;height:13px}.srow.dn2 span{color:var(--mu);text-decoration:line-through}
.rowg{border-bottom:1px solid var(--ln2)}.rowg .row{border-bottom:0}
.sin2{margin:3px 0 6px calc(28px + var(--d,0)*18px);width:calc(100% - 28px - var(--d,0)*18px);padding:6px 9px;font-size:12.5px}
.it~.sin2.qin,.ci .sin2{margin:1px 0 2px calc(10px + var(--d,0)*10px);width:calc(100% - 10px - var(--d,0)*10px);padding:2px 6px;height:22px;font-size:11.5px}
@media(hover:none){.row .isa{opacity:1}}
#dlb .sin2{margin-left:calc(var(--d,0)*22px);width:calc(100% - var(--d,0)*22px)}
#dlb .sub{padding-left:calc(2px + var(--d,0)*22px)}
.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.dh b{font-size:17px;font-weight:700}.dh small{color:var(--mu);font-size:12px}.dh .hl{color:var(--sun)}
.qa{display:flex;gap:6px;margin-bottom:14px}
.qa input{flex:1}
.qa .seg button{height:32px;padding:0 9px}
.gt{font-size:11.5px;font-weight:600;color:var(--mu);margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.gt button{font-weight:500;color:var(--mu)}
.row{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--ln2);cursor:pointer;border-radius:6px}
.row:hover{background:var(--hv)}
.row span{flex:1;min-width:0}.row small{color:var(--mu);font-size:11.5px;white-space:nowrap}
.row.dn2 span{color:var(--mu);text-decoration:line-through}
.row .tm{font-size:12px;color:var(--ac);font-weight:600;min-width:38px}
.empty{color:var(--mu);font-size:12.5px;padding:8px 4px}
.hint{color:var(--mu);font-size:11.5px;margin-top:auto;padding-top:18px;line-height:1.6}

dialog{border:0;border-radius:16px;padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(var(--shc),.18);color:var(--tx)}
dialog::backdrop{background:rgba(var(--shc),.28)}
.dl{padding:18px 18px 16px}
.dl .t{font-size:17px;font-weight:700;border:0;padding:2px 0 8px;border-bottom:1px solid var(--ln);border-radius:0;margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.f2 label,.fl{font-size:11.5px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.fl{margin:10px 0 4px}
.sub{display:flex;align-items:center;gap:8px;padding:5px 2px}.sub span{flex:1}.sub.dn2 span{color:var(--mu);text-decoration:line-through}
.x{color:var(--mu);font-size:15px;width:22px;height:22px;border-radius:6px}.x:hover{background:var(--hv);color:var(--sun)}
.bt{display:flex;justify-content:space-between;margin-top:16px}
.del{color:var(--sun);font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;z-index:99;transition:opacity .3s}.toast.o{opacity:0}


.ptabs{display:flex;margin-bottom:14px}.ptabs button{flex:1;height:28px}
.pbs{display:flex;flex-direction:column;gap:2px;margin:1px -5px 3px}
.pb,.pb0{height:15px;flex:none}
.pb{position:relative;font-size:11px;line-height:15px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:color-mix(in srgb,var(--pc) 55%,#1a1a1a);background:color-mix(in srgb,var(--pc) 20%,#fff);cursor:pointer;font-weight:600}
.pb.s{border-left:3px solid var(--pc);margin-left:5px;padding-left:5px;border-radius:3px 0 0 3px}.pb.e{margin-right:5px;border-radius:0 3px 3px 0}.pb.s.e{border-radius:3px}
.pb:hover{background:color-mix(in srgb,var(--pc) 26%,#fff)}
.pb.pdn{opacity:.45;font-weight:500}
.pb .rz{border-radius:0 3px 3px 0}.pb:hover .rz{background:color-mix(in srgb,var(--pc) 45%,#fff)}
.lci{display:flex;flex-direction:column;gap:2px;margin:2px 0 0;padding:0 5px;overflow:hidden}
.lci .more{line-height:18px}
.it.pi{padding-left:9px}.it.pi.rg.s{padding-left:9px}
.it.pi:not(.ev)::before{content:'';position:absolute;left:3px;top:3px;bottom:3px;width:2px;border-radius:1px;background:var(--pc,#ccc);opacity:.7}
.pb.dropP{background:color-mix(in srgb,var(--pc) 45%,#fff);box-shadow:0 0 0 2px var(--pc)}
.pdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.row .pdot{width:8px;height:8px}
#grid.fx [data-p]:not(.on),#grid.fx .it:not([data-p]),#grid.fx .it.sb{opacity:.18}
#grid.fx .pb.on{background:color-mix(in srgb,var(--pc) 30%,#fff)}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:color-mix(in srgb,var(--pc) 14%,#fff);color:color-mix(in srgb,var(--pc) 75%,#000);padding:3px 4px 3px 9px;border-radius:999px;font-weight:600;margin-right:6px}
.fchip i{width:7px;height:7px;border-radius:50%;background:var(--pc)}.fchip button{width:18px;height:18px;border-radius:50%;color:inherit;font-size:13px;line-height:18px}.fchip button:hover{background:rgba(0,0,0,.08)}
.pcard{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.pcard:hover{border-color:var(--mu2)}.pcard.sel{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc)}
.pct{display:flex;align-items:center;gap:7px}.pct i{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}.pct b{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pct small{color:var(--mu);font-size:11.5px}
